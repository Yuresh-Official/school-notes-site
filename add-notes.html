<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Add Notes - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 40px; text-align: center; }
        .box { background: #0d0d0f; padding: 20px; border-radius: 20px; max-width: 400px; margin: auto; border: 1px solid #1c1c1e; }
        select, textarea, button { width: 100%; margin-top: 15px; padding: 12px; border-radius: 10px; border: none; outline: none; }
        textarea { height: 100px; background: #1c1c1e; color: #fff; }
        button { background: #5856d6; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add New Note</h2>
        <select id="sub"><option value="science">Science</option><option value="maths">Maths</option><option value="ict">ICT</option></select>
        <textarea id="msg" placeholder="Type your note here..."></textarea>
        <button onclick="send()">Add to Site</button>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g",
            databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        function send() {
            const s = document.getElementById('sub').value;
            const m = document.getElementById('msg').value;
            if(m) {
                firebase.database().ref('notes/' + s).push({ text: m });
                alert("වැඩේ හරි! සයිට් එකට ඇඩ් වුණා.");
                document.getElementById('msg').value = "";
            }
        }
    </script>
</body>
</html>
