<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #121212; padding: 20px; border-radius: 15px; border: 1px solid #333; max-width: 400px; margin: auto; }
        textarea { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #4f46e5; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .label { display: block; padding: 15px; border: 1px dashed #333; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Admin Panel</h2>
    <div class="card">
        <label class="label" for="fileInput">📁 පින්තූර/වීඩියෝ තෝරන්න</label>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" onchange="document.getElementById('st').innerText=this.files[0].name">
        <p id="st" style="font-size:12px; color:gray;"></p>
        <textarea id="noteText" rows="4" placeholder="විස්තරය ලියන්න..."></textarea>
        <button id="upBtn" class="btn" onclick="upload()">SAVE TO FIREBASE</button>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const IMGBB_KEY = "87df23f624dc272459c450218569e160";
    const CLOUD_URL = "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
    const PRESET = "Yuresh_preset";

    async function upload() {
        const text = document.getElementById('noteText').value, file = document.getElementById('fileInput').files[0], btn = document.getElementById('upBtn');
        if(!text && !file) return alert("යමක් ඇතුළත් කරන්න.");
        btn.disabled = true; btn.innerText = "UPLOADING...";
        let url = "", type = "text";
        try {
            if(file) {
                let fd = new FormData();
                if(file.type.startsWith('image/')) {
                    fd.append("image", file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
                    const d = await res.json(); url = d.data.url; type = "image";
                } else {
                    fd.append("file", file); fd.append("upload_preset", PRESET);
                    const res = await fetch(CLOUD_URL, { method: "POST", body: fd });
                    const d = await res.json(); url = d.secure_url; type = "video";
                }
            }
            await db.ref('smart_notes').push({ text, url, fileType: type, time: new Date().toLocaleString() });
            alert("සාර්ථකයි!"); location.reload();
        } catch(e) { alert("Error"); btn.disabled = false; }
    }
</script>
</body>
</html>
