<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes SL - Ultimate Media Support</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --primary: #4f46e5; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; }
        .container { max-width: 500px; margin: auto; }
        .input-card { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        textarea { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        .file-label { display: block; background: #1e1e1e; border: 1px dashed var(--border); padding: 15px; text-align: center; border-radius: 10px; cursor: pointer; margin: 10px 0; }
        .main-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; }
        .note-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .media-content { width: 100%; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:orange;">Smart Notes Sri Lanka</h2>
    
    <div class="input-card">
        <label class="file-label" for="fileInput">📁 Photo හෝ Video තෝරන්න</label>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" onchange="document.getElementById('status').innerText = 'තෝරාගත්තා: ' + this.files[0].name">
        <p id="status" style="font-size:12px; color:gray; text-align:center;"></p>
        
        <textarea id="noteInput" rows="4" placeholder="ඔබේ සටහන මෙතැන ලියන්න..."></textarea>
        <button id="submitBtn" class="main-btn" onclick="saveNote()">SAVE TO FIREBASE</button>
    </div>

    <div id="notesFeed"></div>
</div>

<script>
    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g",
        databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. API Keys
    const IMGBB_KEY = "87df23f624dc272459c450218569e160";
    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
    const CLOUDINARY_PRESET = "ඔයාගේ_UPLOAD_PRESET_එක"; // Cloudinary හි Unsigned Preset නම මෙතනට දාන්න

    async function saveNote() {
        const text = document.getElementById('noteInput').value;
        const file = document.getElementById('fileInput').files[0];
        const btn = document.getElementById('submitBtn');

        if (!text.trim() && !file) return alert("කරුණාකර විස්තරයක් ඇතුළත් කරන්න.");

        btn.disabled = true;
        btn.innerText = "UPLOADING...";

        let finalUrl = "";
        let fileType = "text";

        try {
            if (file) {
                let formData = new FormData();
                
                // පින්තූරයක් නම් ImgBB වෙත
                if (file.type.startsWith('image/')) {
                    formData.append("image", file);
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
                    const data = await res.json();
                    finalUrl = data.data.url;
                    fileType = "image";
                } 
                // වීඩියෝවක් නම් Cloudinary වෙත
                else if (file.type.startsWith('video/')) {
                    formData.append("file", file);
                    formData.append("upload_preset", CLOUDINARY_PRESET);
                    const res = await fetch(CLOUDINARY_URL, { method: "POST", body: formData });
                    const data = await res.json();
                    finalUrl = data.secure_url;
                    fileType = "video";
                }
            }

            // 3. Firebase Database එකට Text එක සහ Link එක යැවීම
            await db.ref('smart_notes').push({
                text: text,
                url: finalUrl,
                fileType: fileType,
                time: new Date().toLocaleString()
            });

            alert("Firebase එකට සාර්ථකව ඇඩ් වුණා!");
            document.getElementById('noteInput').value = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('status').innerText = "";

        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "SAVE TO FIREBASE";
        }
    }

    // සටහන් පෙන්වීම (Display Notes)
    db.ref('smart_notes').on('value', (snap) => {
        const feed = document.getElementById('notesFeed');
        feed.innerHTML = "";
        snap.forEach((child) => {
            const n = child.val();
            let media = "";
            if (n.url) {
                if (n.fileType === "video") media = `<video src="${n.url}" class="media-content" controls></video>`;
                else media = `<img src="${n.url}" class="media-content" onclick="window.open('${n.url}')">`;
            }
            feed.innerHTML = `<div class="note-card">${media}<div>${n.text}</div><small style="color:gray;">${n.time}</small></div>` + feed.innerHTML;
        });
    });
</script>
</body>
</html>
