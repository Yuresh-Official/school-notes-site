<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-card { background: #1c1c1e; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .info { display: flex; align-items: center; gap: 10px; }
        .info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .del-btn { background: #ff3b30; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        input { padding: 12px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #444; width: 100%; max-width: 250px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div id="login" style="text-align:center; margin-top:100px;">
        <h2>Owner Admin</h2>
        <input type="password" id="pass" placeholder="Password">
        <br>
        <button onclick="auth()" style="padding:12px 40px; background:#30d158; color:#fff; border:none; border-radius:10px; font-weight:bold;">Login</button>
    </div>

    <div id="content" style="display:none; max-width:600px; margin:0 auto;">
        <h3>Manage All Posts</h3>
        <hr style="border:0.5px solid #333; margin-bottom:20px;">
        <div id="list">Loading...</div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function auth() {
            // පාස්වර්ඩ් එක මෙතනින් ඕනෙ නම් වෙනස් කරන්න
            if(document.getElementById('pass').value === "yuresh123") {
                document.getElementById('login').style.display='none';
                document.getElementById('content').style.display='block';
                load();
            } else { alert("මුරපදය වැරදියි!"); }
        }

        function load() {
            db.ref('smart_notes').on('value', snap => {
                const div = document.getElementById('list'); div.innerHTML = "";
                snap.forEach(c => {
                    const d = c.val();
                    div.innerHTML += `<div class="admin-card">
                        <div class="info">
                            <img src="${d.uPhoto}">
                            <div>
                                <b>${d.uName}</b><br>
                                <span style="font-size:12px; color:gray;">${d.text ? d.text.substring(0,30) + '...' : 'Media Post'}</span>
                            </div>
                        </div>
                        <button class="del-btn" onclick="del('${c.key}')">Delete</button>
                    </div>`;
                });
                if(div.innerHTML === "") div.innerHTML = "පෝස්ට් කිසිවක් නැත.";
            });
        }

        function del(id) {
            if(confirm("මෙම පෝස්ට් එක මකා දැමීමට ස්ථිරද?")) {
                db.ref('smart_notes/'+id).remove();
            }
        }
    </script>
</body>
</html>
