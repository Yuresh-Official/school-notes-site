<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes SL - Ultra Fast</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #151517; --text: #fff; --primary: #30d158; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        #welcomeScreen { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .p-setup-img { width: 90px; height: 90px; border-radius: 50%; border: 2.5px solid var(--primary); object-fit: cover; margin-bottom: 20px; }
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 15px 120px 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .note-card { width: 100%; max-width: 360px; background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 18px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; }
        .u-name { font-size: 15px; font-weight: 700; color: #fff; }
        .media-box { width: 100%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; }
        .media-box img, .media-box video { width: 100%; height: auto; display: block; max-height: 500px; object-fit: contain; border-radius: 12px; }
        .react-bar { display: flex; gap: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
        .react-btn { background: rgba(255,255,255,0.06); border: none; padding: 7px 15px; border-radius: 20px; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; z-index: 1000; }
        
        /* New Speed & Preview UI */
        #previewGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; width: 100%; }
        .thumb-preview { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; border: 1px solid #333; }
        .progress-container { width: 100%; height: 8px; background: #222; border-radius: 4px; margin: 15px 0 5px 0; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s linear; }
        #percentLabel { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        #chatBox { position: fixed; bottom: 90px; right: 20px; width: 290px; height: 400px; background: #1c1c1e; border: 0.5px solid var(--border); border-radius: 20px; display: none; flex-direction: column; z-index: 3000; }
        #chatLogs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
    <div id="welcomeScreen">
        <label for="pUpload"><img id="pPreview" class="p-setup-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
        <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewP(this)">
        <input type="text" id="uNameInp" placeholder="ඔබේ නම..." style="width:75%; padding:15px; border-radius:15px; border:none; margin-bottom:20px; text-align:center; background:#222; color:#fff;">
        <button onclick="saveProfile()" style="background:var(--primary); color:#fff; border:none; padding:15px 50px; border-radius:30px; font-weight:700;">Start</button>
    </div>

    <div class="scroll-container">
        <h2 style="width: 100%; max-width: 360px; margin-bottom: 15px;">Smart Feed</h2>
        <div id="notesFeed" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <button class="fab" onclick="toggleAdd()">+</button>
    <button class="fab" onclick="toggleChat()" style="left: 25px; background: #007aff;">💬</button>

    <div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:4000; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
        <div style="width: 100%; max-width: 360px; text-align: center;">
            <textarea id="noteTxt" placeholder="මොනවා හරි ලියන්න..." style="width:100%; height:100px; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; margin-bottom:10px; outline:none;"></textarea>
            
            <input type="file" id="fileInp" accept="image/*,video/*" multiple onchange="handlePreview(this)" style="color:gray; font-size:12px; margin-bottom:10px;">
            
            <div id="previewGrid"></div> <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
            <div id="percentLabel" style="display:none;">0% Uploading...</div>

            <button id="postBtn" onclick="postNote()" style="width: 100%; background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700; margin-top:10px;">දැන්ම පළ කරන්න</button>
            <button onclick="toggleAdd()" id="cancelBtn" style="background:none; border:none; color:gray; margin-top:15px;">අතහරින්න</button>
        </div>
    </div>

    <div id="chatBox">
        <div id="chatLogs"></div>
        <div style="padding:10px; display:flex; gap:8px; border-top: 0.5px solid var(--border);">
            <input type="text" id="chatInp" placeholder="මැසේජ් එකක්..." style="flex:1; background:#222; border:none; padding:10px; border-radius:20px; color:#fff; outline:none;">
            <button onclick="sendMsg()" style="color:var(--primary); background:none; border:none; font-weight:700;">Send</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkUser() {
            const s = localStorage.getItem("smart_user_v2");
            if(s) { const d = JSON.parse(s); if(new Date().getTime() - d.timestamp < 86400000) return d; }
            return null;
        }
        let myData = checkUser();
        if(!myData) document.getElementById('welcomeScreen').style.display = 'flex';

        function previewP(i) { if(i.files[0]) { const r = new FileReader(); r.onload=e=>document.getElementById('pPreview').src=e.target.result; r.readAsDataURL(i.files[0]); } }
        
        async function saveProfile() {
            const name = document.getElementById('uNameInp').value, file = document.getElementById('pUpload').files[0];
            if(!name || !file) return alert("නම සහ DP අවශ්‍යයි!");
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
            const d = await res.json();
            myData = { name, photo: d.data.url, timestamp: new Date().getTime() };
            localStorage.setItem("smart_user_v2", JSON.stringify(myData));
            location.reload();
        }

        // Real-time Preview
        function handlePreview(input) {
            const grid = document.getElementById('previewGrid');
            grid.innerHTML = "";
            if (input.files) {
                Array.from(input.files).slice(0, 4).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const el = file.type.startsWith('video') ? document.createElement('video') : document.createElement('img');
                        el.src = e.target.result; el.className = "thumb-preview";
                        grid.appendChild(el);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
        function toggleChat() { const b = document.getElementById('chatBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

        async function postNote() {
            const text = document.getElementById('noteTxt').value, files = document.getElementById('fileInp').files, btn = document.getElementById('postBtn');
            if(!text && files.length === 0) return;
            
            btn.disabled = true; btn.innerText = "වේගයෙන් අප්ලෝඩ් වේ...";
            document.getElementById('progCont').style.display = 'block';
            document.getElementById('percentLabel').style.display = 'block';
            document.getElementById('cancelBtn').style.display = 'none';

            let uploads = Array.from(files).slice(0, 4).map(async (file, index) => {
                let fd = new FormData();
                let uploadUrl = "", type = "";

                if(file.type.startsWith('image')) {
                    fd.append("image", file);
                    uploadUrl = "https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160";
                    type = "image";
                } else {
                    fd.append("file", file);
                    fd.append("upload_preset", "Yuresh_preset");
                    uploadUrl = "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
                    type = "video";
                }

                // Simulate UI Speed
                let p = 0; let iv = setInterval(() => { 
                    p += Math.random() * 15; 
                    if(p < 95) {
                        document.getElementById('progBar').style.width = p + "%";
                        document.getElementById('percentLabel').innerText = Math.floor(p) + "% Fast Syncing...";
                    }
                }, 100);

                const res = await fetch(uploadUrl, { method: "POST", body: fd });
                const d = await res.json();
                clearInterval(iv);
                
                return { url: type === "image" ? d.data.url : d.secure_url, type };
            });

            // If no files, just post text
            if(files.length === 0) {
                await db.ref('smart_notes').push({ uName: myData.name, uPhoto: myData.photo, text, url:"", fileType:"text", time: Date.now(), love:0 });
            } else {
                const results = await Promise.all(uploads); // Parallel Execution (වේගයෙන්ම වෙන්නේ මෙතනයි)
                for(let i=0; i<results.length; i++) {
                    await db.ref('smart_notes').push({ 
                        uName: myData.name, uPhoto: myData.photo, 
                        text: i === 0 ? text : "", 
                        url: results[i].url, fileType: results[i].type, 
                        time: Date.now(), love:0 
                    });
                }
            }
            document.getElementById('progBar').style.width = "100%";
            setTimeout(() => location.reload(), 500);
        }

        db.ref('smart_notes').limitToLast(20).on('value', snap => {
            const feed = document.getElementById('notesFeed');
            snap.forEach(c => {
                const id = c.key, d = c.val(), existing = document.getElementById('card-'+id);
                if(!existing) {
                    let media = d.url ? (d.fileType === "video" ? `<div class="media-box"><video src="${d.url}" controls playsinline preload="metadata"></video></div>` : `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`) : "";
                    const html = `<div class="note-card" id="card-${id}">
                        <div class="user-info"><img src="${d.uPhoto}" class="p-img"><span class="u-name">${d.uName}</span></div>
                        <div style="font-size:15px; color:#ccc; word-break: break-word;">${d.text || ""}</div>${media}
                        <div class="react-bar"><button class="react-btn" onclick="db.ref('smart_notes/${id}/love').transaction(c=>(c||0)+1)">❤️ <span id="react-${id}">${d.love||0}</span></button></div>
                    </div>`;
                    feed.insertAdjacentHTML('afterbegin', html);
                } else { document.getElementById('react-'+id).innerText = d.love || 0; }
            });
        });

        function sendMsg() { const i = document.getElementById('chatInp'); if(i.value) { db.ref('chat').push({name:myData.name, photo:myData.photo, msg:i.value}); i.value=""; } }
        db.ref('chat').limitToLast(20).on('value', s => {
            const l = document.getElementById('chatLogs'); l.innerHTML = "";
            s.forEach(c => {
                const d = c.val(), isMe = d.name === myData.name;
                l.innerHTML += `<div style="display:flex; flex-direction:${isMe?'row-reverse':'row'}; gap:8px; margin-bottom:10px;">
                    <img src="${d.photo}" style="width:20px; height:20px; border-radius:50%; object-fit:cover;">
                    <div style="background:${isMe?'#30d158':'#333'}; padding:8px 12px; border-radius:15px; font-size:13px;"><b>${d.name}</b><br>${d.msg}</div>
                </div>`;
            });
            l.scrollTop = l.scrollHeight;
        });
    </script>
</body>
</html>
