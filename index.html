<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes Sri Lanka - Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #151517; --text: #fff; --primary: #30d158; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        /* 24H Setup */
        #welcomeScreen { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .p-setup-img { width: 90px; height: 90px; border-radius: 50%; border: 2.5px solid var(--primary); object-fit: cover; margin-bottom: 20px; }

        /* Compact Layout */
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 15px 120px 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        .note-card { 
            width: 100%; 
            max-width: 360px; /* කාඩ් එකේ සයිස් එක කුඩා කළා */
            background: var(--card); 
            border-radius: 18px; 
            padding: 12px; 
            margin-bottom: 18px; 
            border: 0.5px solid var(--border);
        }

        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #222; }
        .u-name { font-size: 15px; font-weight: 700; color: #fff; }
        
        /* Media Auto-Ratio (Full View) */
        .media-box { width: 100%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; display: flex; justify-content: center; }
        .media-box img, .media-box video { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-height: 500px; 
            object-fit: contain; 
            border-radius: 12px;
        }

        /* React Bar */
        .react-bar { display: flex; gap: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); margin-top: 5px; }
        .react-btn { background: rgba(255,255,255,0.06); border: none; padding: 7px 15px; border-radius: 20px; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

        /* Floating Buttons */
        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; z-index: 1000; box-shadow: 0 5px 15px rgba(48,209,88,0.3); }
        .chat-fab { position: fixed; bottom: 25px; left: 25px; width: 55px; height: 55px; border-radius: 50%; background: #007aff; color: #fff; border: none; font-size: 24px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,122,255,0.3); }

        /* Chat UI */
        #chatBox { position: fixed; bottom: 90px; right: 20px; width: 290px; height: 400px; background: #1c1c1e; border: 0.5px solid var(--border); border-radius: 20px; display: none; flex-direction: column; z-index: 3000; }
        #chatLogs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { display: flex; gap: 8px; align-items: flex-end; max-width: 90%; }
        .chat-msg.me { align-self: flex-end; flex-direction: row-reverse; }
        .chat-bubble { padding: 8px 12px; border-radius: 15px; font-size: 13px; background: #333; }
        .chat-msg.me .chat-bubble { background: var(--primary); }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <label for="pUpload"><img id="pPreview" class="p-setup-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
    <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewP(this)">
    <input type="text" id="uNameInp" placeholder="ඔබේ නම..." style="width:75%; padding:15px; border-radius:15px; border:none; margin-bottom:20px; text-align:center; background:#222; color:#fff; font-size:16px;">
    <button onclick="saveProfile()" style="background:var(--primary); color:#fff; border:none; padding:15px 50px; border-radius:30px; font-weight:700;">Start Now</button>
</div>

<div class="scroll-container">
    <h2 style="width: 100%; max-width: 360px; text-align: left; margin-bottom: 15px;">Smart Feed</h2>
    <div id="notesFeed" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
</div>

<button class="chat-fab" onclick="toggleChat()">💬</button>
<button class="fab" onclick="toggleAdd()">+</button>

<div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:4000; padding:20px; flex-direction:column; justify-content:center; align-items: center;">
    <div style="width: 100%; max-width: 360px;">
        <textarea id="noteTxt" placeholder="මොනවා හරි ලියන්න..." style="width:100%; height:130px; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; margin-bottom:15px; outline:none; font-size:16px;"></textarea>
        <input type="file" id="fileInp" accept="image/*,video/*" style="margin-bottom:20px; color:gray;">
        <button id="postBtn" onclick="postNote()" style="width: 100%; background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700; font-size:16px;">පළ කරන්න</button>
        <button onclick="toggleAdd()" style="width: 100%; background:none; border:none; color:gray; margin-top:15px;">අතහරින්න</button>
    </div>
</div>

<div id="chatBox">
    <div id="chatLogs"></div>
    <div style="padding:10px; display:flex; gap:8px; border-top: 0.5px solid var(--border);">
        <input type="text" id="chatInp" placeholder="මැසේජ් එකක්..." style="flex:1; background:#222; border:none; padding:10px; border-radius:20px; color:#fff; outline:none;">
        <button onclick="sendMsg()" style="color:var(--primary); background:none; border:none; font-weight:700;">Send</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 24H Session Check
    function checkUser() {
        const stored = localStorage.getItem("smart_user_24h_pro");
        if (stored) {
            const data = JSON.parse(stored);
            if (new Date().getTime() - data.timestamp < 24 * 60 * 60 * 1000) return data;
        }
        return null;
    }

    let myData = checkUser();
    if(!myData) document.getElementById('welcomeScreen').style.display = 'flex';

    function previewP(i) { if(i.files[0]) { const r = new FileReader(); r.onload=e=>document.getElementById('pPreview').src=e.target.result; r.readAsDataURL(i.files[0]); } }

    async function saveProfile() {
        const name = document.getElementById('uNameInp').value, file = document.getElementById('pUpload').files[0];
        if(!name || !file) return alert("නම සහ පින්තූරයක් ඇතුළත් කරන්න!");
        const fd = new FormData(); fd.append("image", file);
        const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
        const d = await res.json();
        myData = { name, photo: d.data.url, timestamp: new Date().getTime() };
        localStorage.setItem("smart_user_24h_pro", JSON.stringify(myData));
        location.reload();
    }

    function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
    function toggleChat() { const b = document.getElementById('chatBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

    async function postNote() {
        const text = document.getElementById('noteTxt').value, file = document.getElementById('fileInp').files[0], btn = document.getElementById('postBtn');
        if(!text && !file) return;
        btn.disabled = true; btn.innerText = "Syncing...";
        let url = "", type = "text";
        if(file) {
            let fd = new FormData();
            if(file.type.startsWith('image')) {
                fd.append("image", file);
                const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
                const d = await res.json(); url = d.data.url; type = "image";
            } else {
                fd.append("file", file); fd.append("upload_preset", "Yuresh_preset");
                const res = await fetch("https://api.cloudinary.com/v1_1/ds5ig0wvd/upload", {method:"POST", body:fd});
                const d = await res.json(); url = d.secure_url; type = "video";
            }
        }
        await db.ref('smart_notes').push({ uName: myData.name, uPhoto: myData.photo, text, url, fileType: type, time: Date.now(), love:0 });
        location.reload();
    }

    // Real-time Feed with Working Reacts
    db.ref('smart_notes').limitToLast(20).on('value', snap => {
        const feed = document.getElementById('notesFeed');
        snap.forEach(c => {
            const id = c.key, d = c.val(), existing = document.getElementById('card-'+id);
            if(!existing) {
                let media = d.url ? (d.fileType === "video" ? `<div class="media-box"><video src="${d.url}" controls playsinline preload="metadata"></video></div>` : `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`) : "";
                const html = `<div class="note-card" id="card-${id}">
                    <div class="user-info"><img src="${d.uPhoto}" class="p-img"><span class="u-name">${d.uName}</span></div>
                    <div style="font-size:15px; color:#ddd; line-height:1.4;">${d.text || ""}</div>${media}
                    <div class="react-bar">
                        <button class="react-btn" onclick="db.ref('smart_notes/${id}/love').transaction(c=>(c||0)+1)">❤️ <span id="react-${id}">${d.love||0}</span></button>
                    </div></div>`;
                feed.insertAdjacentHTML('afterbegin', html);
            } else {
                document.getElementById('react-'+id).innerText = d.love || 0;
            }
        });
    });

    function sendMsg() { const i = document.getElementById('chatInp'); if(i.value) { db.ref('chat').push({name:myData.name, photo:myData.photo, msg:i.value}); i.value=""; } }
    db.ref('chat').limitToLast(20).on('value', s => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => {
            const d = c.val(), isMe = d.name === myData.name;
            l.innerHTML += `<div class="chat-msg ${isMe?'me':''}">
                <img src="${d.photo}" class="p-img" style="width:22px; height:22px;">
                <div class="chat-bubble"><b>${d.name}</b><br>${d.msg}</div>
            </div>`;
        });
        l.scrollTop = l.scrollHeight;
    });
</script>
</body>
</html>
