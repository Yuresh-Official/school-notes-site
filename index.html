<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Notes - iOS Style</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: rgba(28, 28, 30, 0.8); --text: #fff; --primary: #007aff; --border: #38383a; }

        /* Themes (1-12) */
        body[data-theme="1"] { --bg: #f2f2f7; --card: #fff; --text: #000; --border: #c6c6c8; }
        body[data-theme="2"] { --bg: #000; --card: #1c1c1e; --text: #fff; --border: #38383a; }
        body[data-theme="3"] { --bg: #001f3f; --card: #003366; --text: #fff; --primary: #0074d9; }
        body[data-theme="4"] { --bg: #1a001a; --card: #330033; --text: #fff; --primary: #ff00ff; }
        body[data-theme="5"] { --bg: #0b141a; --card: #121b22; --text: #e9edef; --primary: #00a884; }
        body[data-theme="6"] { --bg: #1a1a00; --card: #333300; --text: #fff; --primary: #cccc00; }
        body[data-theme="7"] { --bg: #2d0a0a; --card: #4a1111; --text: #fff; --primary: #ff4d4d; }
        body[data-theme="8"] { --bg: #0a2d2d; --card: #114a4a; --text: #fff; --primary: #20c997; }
        body[data-theme="9"] { --bg: #1c1c1c; --card: #2c2c2e; --text: #ffd700; --primary: #ffd700; }
        body[data-theme="10"] { --bg: #fff0f5; --card: #ffe4e1; --text: #db7093; --primary: #ff69b4; }
        body[data-theme="11"] { --bg: #121212; --card: #1e1e1e; --text: #bb86fc; --primary: #bb86fc; }
        body[data-theme="12"] { --bg: #2c3e50; --card: #34495e; --text: #ecf0f1; --primary: #3498db; }

        /* Security Features */
        body { 
            background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif;
            margin: 0; padding: 20px; transition: 0.4s;
            user-select: none; -webkit-user-select: none;
            overscroll-behavior-y: contain; /* තහනම් කරනවා Pull-to-refresh */
        }

        .container { max-width: 500px; margin: auto; padding-bottom: 100px; }

        /* iOS Search Bar */
        .search-bar {
            background: rgba(118, 118, 128, 0.24); border-radius: 10px;
            padding: 10px 15px; display: flex; align-items: center; margin-bottom: 20px;
        }
        .search-bar input { background: none; border: none; color: var(--text); width: 100%; outline: none; font-size: 17px; }

        /* Note Cards */
        .note-card {
            background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 0.5px solid var(--border);
        }
        .media-content { width: 100%; border-radius: 10px; margin-bottom: 12px; }
        .ios-btn { color: var(--primary); background: none; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }

        /* Chat System */
        #chatBox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 2000; display: none; flex-direction: column;
        }
        .chat-header { background: var(--card); padding: 45px 15px 15px; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #chatLogs { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 18px; max-width: 75%; font-size: 15px; }
        .msg.me { align-self: flex-end; background: var(--primary); color: #fff; }
        .msg.other { align-self: flex-start; background: #3a3a3c; color: #fff; }
        .msg-name { font-size: 10px; margin-bottom: 3px; opacity: 0.7; }

        .chat-input { background: var(--card); padding: 10px 15px 30px; border-top: 0.5px solid var(--border); display: flex; gap: 10px; }
        .chat-input input { flex: 1; background: rgba(118, 118, 128, 0.24); border: none; padding: 10px 15px; border-radius: 20px; color: #fff; outline: none; }

        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); border: none; color: #fff; font-size: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    </style>
</head>
<body data-theme="2">

<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h1 style="font-size:34px; font-weight:bold;">Notes</h1>
        <button class="ios-btn" onclick="nextTheme()">Change Theme</button>
    </div>

    <div class="search-bar">
        <span style="opacity:0.5; margin-right:8px;">🔍</span>
        <input type="text" id="searchInput" placeholder="Search" onkeyup="searchNotes()">
    </div>

    <button onclick="toggleInput()" style="width:100%; background:var(--primary); color:#fff; border:none; padding:12px; border-radius:10px; font-weight:600; margin-bottom:20px;">+ New Note</button>

    <div id="inputSection" style="display:none; background:var(--card); padding:15px; border-radius:14px; margin-bottom:20px;">
        <textarea id="noteInput" rows="4" style="width:100%; background:none; border:none; color:var(--text); font-size:16px; outline:none;" placeholder="Start writing..."></textarea>
        <button onclick="saveNote()" style="width:100%; background:var(--primary); color:#fff; border:none; padding:10px; border-radius:8px; margin-top:10px;">Save</button>
    </div>

    <div id="notesFeed"></div>
</div>

<button class="fab" onclick="openChat()">💬</button>

<div id="chatBox">
    <div class="chat-header">
        <button class="ios-btn" onclick="closeChat()">Back</button>
        <span style="font-weight:600;">Yuresh WhatsApp</span>
        <span style="width:40px;"></span>
    </div>
    <div id="chatLogs"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="iMessage">
        <button onclick="sendChatText()" style="background:var(--primary); color:#fff; border:none; width:35px; height:35px; border-radius:50%; font-size:18px;">↑</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentTheme = 2;
    function nextTheme() { currentTheme = currentTheme >= 12 ? 1 : currentTheme + 1; document.body.setAttribute('data-theme', currentTheme); }

    db.ref('smart_notes').on('value', snap => {
        const feed = document.getElementById('notesFeed'); feed.innerHTML = "";
        snap.forEach(c => {
            const n = c.val(), k = c.key;
            let m = n.url ? (n.fileType === "video" ? `<video src="${n.url}" class="media-content" controls></video>` : `<img src="${n.url}" class="media-content">`) : "";
            feed.innerHTML = `<div class="note-card">${m}<div style="font-size:17px; margin-bottom:12px;">${n.text}</div><div style="display:flex; gap:15px;"><button class="ios-btn" onclick="copyText(\`${n.text}\`)">Copy</button><button class="ios-btn" style="color:#ff3b30" onclick="deleteNote('${k}')">Delete</button></div></div>` + feed.innerHTML;
        });
    });

    function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
    function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    function sendChatText() { const i = document.getElementById('chatInput'); if(i.value.trim()){ db.ref('community_chat').push({ name: "Yuresh", msg: i.value }); i.value = ""; } }
    
    db.ref('community_chat').limitToLast(20).on('value', s => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => { const d = c.val(); const isMe = d.name === "Yuresh"; l.innerHTML += `<div class="msg ${isMe ? 'me' : 'other'}"><div class="msg-name">${d.name}</div>${d.msg}</div>`; });
        l.scrollTop = l.scrollHeight;
    });

    function toggleInput() { const s = document.getElementById('inputSection'); s.style.display = s.style.display === "none" ? "block" : "none"; }
    function copyText(t) { navigator.clipboard.writeText(t); alert("Copied!"); }
    function deleteNote(k) { if(confirm("Delete?")) db.ref('smart_notes/' + k).remove(); }
    function searchNotes() { const q = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.note-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none"); }

    // Security: No Zooming
    document.addEventListener('touchstart', function(e) { if(e.touches.length > 1) e.preventDefault(); }, {passive: false});
</script>
</body>
</html>
