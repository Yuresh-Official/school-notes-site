<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes - Super Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #000; --card: rgba(35, 35, 35, 0.5); --text: #eee; --primary: #30d158; --border: rgba(255, 255, 255, 0.1); 
            --glass: blur(20px) saturate(180%);
        }
        body[data-theme="1"] { --bg: #f2f2f7; --card: rgba(255, 255, 255, 0.6); --text: #1c1c1e; --border: rgba(0, 0, 0, 0.1); --primary: #007aff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; transition: 0.5s ease; overflow: hidden; }
        
        #welcomeScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .profile-upload { width: 90px; height: 90px; background: #333; border-radius: 50%; overflow: hidden; margin-bottom: 20px; border: 2.5px solid var(--primary); cursor: pointer; }
        .profile-upload img { width: 100%; height: 100%; object-fit: cover; }
        
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 10px 100px 10px; box-sizing: border-box; }
        .note-card { background: var(--card); backdrop-filter: var(--glass); border-radius: 14px; padding: 10px; margin-bottom: 12px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
        .p-img { width: 25px; height: 25px; border-radius: 50%; object-fit: cover; background: #444; }
        
        .media-container { width: 100%; border-radius: 10px; overflow: hidden; background: #111; margin-bottom: 8px; max-height: 220px; display: flex; align-items: center; }
        .media-content { width: 100%; height: auto; max-height: 220px; object-fit: cover; }
        .note-text { font-size: 13px; margin-bottom: 8px; opacity: 0.9; white-space: pre-wrap; }
        
        #chatBox { position: fixed; bottom: 85px; right: 15px; width: 300px; height: 420px; background: var(--card); backdrop-filter: var(--glass); z-index: 2000; display: none; flex-direction: column; border-radius: 20px; border: 0.5px solid var(--border); }
        #chatLogs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { display: flex; gap: 6px; align-items: flex-end; }
        .chat-msg.me { flex-direction: row-reverse; }
        .msg-text { padding: 7px 12px; border-radius: 14px; max-width: 75%; font-size: 12px; }
        .chat-msg.me .msg-text { background: var(--primary); color: #fff; border-bottom-right-radius: 2px; }
        .chat-msg.other .msg-text { background: rgba(255,255,255,0.12); border-bottom-left-radius: 2px; }
        
        .fab { position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: #fff; z-index: 1000; font-size: 22px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .ios-btn { color: var(--primary); background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body data-theme="2">

<div id="welcomeScreen">
    <h3 style="color:white">Setup Profile</h3>
    <label for="pUpload" class="profile-upload"><img id="pPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
    <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewProfile(this)">
    <input type="text" id="pName" placeholder="ඔබේ නම..." style="width:70%; padding:10px; border-radius:10px; border:none; margin-bottom:15px; text-align:center;">
    <button onclick="saveProfile()" style="background:var(--primary); color:white; border:none; padding:10px 30px; border-radius:20px; font-weight:700;">Start Now</button>
</div>

<div class="scroll-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h1 style="font-size: 24px; font-weight: 800; margin: 0;">Smart Notes</h1>
        <button class="ios-btn" onclick="nextTheme()">Theme</button>
    </div>

    <button onclick="toggleInput()" style="width:100%; background:var(--card); color:var(--primary); border:0.5px solid var(--border); padding:10px; border-radius:12px; font-weight:700; margin-bottom:15px;">+ New Note</button>

    <div id="inputSection" style="display:none; background:var(--card); padding:12px; border-radius:14px; margin-bottom:20px; border: 0.5px solid var(--border);">
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
        <label for="fileInput" style="color:var(--primary); cursor:pointer; font-size: 13px;">📷 Photo/Video</label>
        <textarea id="noteInput" placeholder="Write here..." style="width:100%; background:none; border:none; color:var(--text); font-size:14px; min-height:60px; outline:none; margin-top:10px;"></textarea>
        <button id="submitBtn" onclick="saveNote()" style="width:100%; background:var(--primary); color:#fff; border:none; padding:10px; border-radius:10px; font-weight:700;">Sync to Cloud</button>
    </div>

    <div id="notesFeed"></div>
</div>

<button class="fab" onclick="openChat()">💬</button>

<div id="chatBox">
    <div style="padding:12px; border-bottom:0.5px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <b>Community Chat</b>
        <button onclick="closeChat()" class="ios-btn">Done</button>
    </div>
    <div id="chatLogs"></div>
    <div style="padding:10px; display:flex; gap:5px; background: rgba(0,0,0,0.15);">
        <button onclick="startVoiceTyping()" style="background:none; border:none; font-size:18px;">🎤</button>
        <input type="text" id="chatInput" placeholder="Message..." style="flex:1; background:rgba(255,255,255,0.08); border:none; padding:8px 12px; border-radius:18px; color:#fff; outline:none; font-size:13px;">
        <button onclick="sendChat()" style="background:none; border:none; color:var(--primary); font-size:18px;">➤</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myData = JSON.parse(localStorage.getItem("smart_user"));
    if(!myData) { document.getElementById('welcomeScreen').style.display = 'flex'; }

    function previewProfile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('pPreview').src = e.target.result; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function saveProfile() {
        const name = document.getElementById('pName').value, file = document.getElementById('pUpload').files[0];
        if(!name || !file) return alert("Add name & photo!");
        const fd = new FormData(); fd.append("image", file);
        const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", { method: "POST", body: fd });
        const d = await res.json();
        myData = { name, photo: d.data.url };
        localStorage.setItem("smart_user", JSON.stringify(myData));
        document.getElementById('welcomeScreen').style.display = 'none';
        location.reload();
    }

    function nextTheme() { const b = document.body; b.setAttribute('data-theme', b.getAttribute('data-theme') == "1" ? "2" : "1"); }
    function toggleInput() { const s = document.getElementById('inputSection'); s.style.display = s.style.display === "none" ? "block" : "none"; }

    async function saveNote() {
        const text = document.getElementById('noteInput').value, file = document.getElementById('fileInput').files[0], btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "Syncing...";
        let url = "", type = "text";
        if(file) {
            let fd = new FormData();
            if(file.type.startsWith('image/')) {
                fd.append("image", file);
                const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", { method: "POST", body: fd });
                const d = await res.json(); url = d.data.url; type = "image";
            } else {
                fd.append("file", file); fd.append("upload_preset", "Yuresh_preset");
                const res = await fetch("https://api.cloudinary.com/v1_1/ds5ig0wvd/upload", { method: "POST", body: fd });
                const d = await res.json(); url = d.secure_url; type = "video";
            }
        }
        await db.ref('smart_notes').push({ text, url, fileType: type, likes: 0, uName: myData.name, uPhoto: myData.photo });
        btn.disabled = false; btn.innerText = "Sync to Cloud"; toggleInput();
        document.getElementById('noteInput').value = ""; document.getElementById('fileInput').value = "";
    }

    db.ref('smart_notes').on('value', snap => {
        const feed = document.getElementById('notesFeed'); feed.innerHTML = "";
        snap.forEach(c => {
            const n = c.val(), k = c.key;
            const uImg = n.uPhoto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            let media = "";
            if(n.url) {
                if(n.fileType === "video") media = `<div class="media-container"><video src="${n.url}" class="media-content" controls playsinline></video></div>`;
                else media = `<div class="media-container"><img src="${n.url}" class="media-content"></div>`;
            }
            feed.innerHTML = `<div class="note-card">
                <div class="user-info"><img src="${uImg}" class="p-img"><b>${n.uName || 'Member'}</b></div>
                ${media}<div class="note-text">${n.text || ""}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button class="ios-btn" onclick="db.ref('smart_notes/${k}/likes').transaction(l=>(l||0)+1)">❤️ ${n.likes || 0}</button>
                    <button class="ios-btn" style="color:#ff3b30; font-size:11px;" onclick="if(confirm('Delete?')) db.ref('smart_notes/${k}').remove()">Delete</button>
                </div>
            </div>` + feed.innerHTML;
        });
    });

    function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
    function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    function sendChat() {
        const i = document.getElementById('chatInput');
        if(i.value) { db.ref('community_chat').push({ name: myData.name, photo: myData.photo, msg: i.value }); i.value = ""; }
    }

    db.ref('community_chat').limitToLast(20).on('value', s => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => {
            const d = c.val(); const isMe = d.name === myData.name;
            l.innerHTML += `<div class="chat-msg ${isMe ? 'me' : 'other'}">
                <img src="${d.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="p-img" style="width:22px; height:22px;">
                <div class="msg-text"><b>${isMe ? 'You' : d.name}</b><br>${d.msg}</div>
            </div>`;
        });
        l.scrollTop = l.scrollHeight;
    });

    function startVoiceTyping() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.lang = 'si-LK'; rec.start();
        document.getElementById('chatInput').placeholder = "Listening...";
        rec.onresult = (e) => { document.getElementById('chatInput').value = e.results[0][0].transcript; document.getElementById('chatInput').placeholder = "Message..."; };
    }
</script>
</body>
</html>
