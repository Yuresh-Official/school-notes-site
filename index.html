<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes SL</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #151517; --text: #fff; --primary: #30d158; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        #welcomeScreen { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .p-setup-img { width: 90px; height: 90px; border-radius: 50%; border: 2.5px solid var(--primary); object-fit: cover; margin-bottom: 20px; }
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 15px 120px 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .note-card { width: 100%; max-width: 360px; background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 18px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .u-name { font-size: 15px; font-weight: 700; }
        .media-box { width: 100%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; }
        .media-box img, .media-box video { width: 100%; height: auto; max-height: 500px; object-fit: contain; }
        .react-bar { display: flex; gap: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); }
        .react-btn { background: rgba(255,255,255,0.06); border: none; padding: 7px 15px; border-radius: 20px; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        
        #previewList { width: 100%; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .preview-item { display: flex; gap: 10px; background: #111; padding: 10px; border-radius: 12px; margin-bottom: 10px; align-items: center; border: 1px solid #222; }
        .preview-item img, .preview-item video { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .caption-input { flex: 1; background: #222; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 8px; outline: none; font-size: 14px; }
        
        .progress-container { width: 100%; height: 8px; background: #222; border-radius: 4px; margin: 15px 0 5px 0; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        #percentLabel { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="welcomeScreen">
        <label for="pUpload"><img id="pPreview" class="p-setup-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
        <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewP(this)">
        <input type="text" id="uNameInp" placeholder="ඔබේ නම..." style="width:75%; padding:15px; border-radius:15px; border:none; margin-bottom:20px; text-align:center; background:#222; color:#fff;">
        <button onclick="saveProfile()" style="background:var(--primary); color:#fff; border:none; padding:15px 50px; border-radius:30px; font-weight:700;">Start</button>
    </div>

    <div class="scroll-container">
        <h2 style="width: 100%; max-width: 360px; margin-bottom: 15px;">Smart Feed</h2>
        <div id="notesFeed" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <button class="fab" onclick="toggleAdd()">+</button>

    <div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:4000; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
        <div style="width: 100%; max-width: 380px; text-align: center;">
            <h3>අලුත් පෝස්ට් එකක්</h3>
            <input type="file" id="fileInp" accept="image/*,video/*" multiple onchange="handleMultiPreview(this)" style="color:gray; font-size:12px; margin-bottom:10px;">
            
            <div id="previewList"></div>

            <div id="percentLabel" style="display:none;">0% Uploading...</div>
            <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>

            <button id="postBtn" onclick="postMulti()" style="width: 100%; background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700; margin-top:15px;">දැන්ම පළ කරන්න</button>
            <button onclick="toggleAdd()" id="cancelBtn" style="background:none; border:none; color:gray; margin-top:10px;">අතහරින්න</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myData = (function(){ const s = localStorage.getItem("smart_user_v2"); if(s){ const d = JSON.parse(s); return d; } return null; })();
        if(!myData) document.getElementById('welcomeScreen').style.display = 'flex';

        function previewP(i) { if(i.files[0]) { const r = new FileReader(); r.onload=e=>document.getElementById('pPreview').src=e.target.result; r.readAsDataURL(i.files[0]); } }
        async function saveProfile() {
            const name = document.getElementById('uNameInp').value, file = document.getElementById('pUpload').files[0];
            if(!name || !file) return alert("නම සහ DP අවශ්‍යයි!");
            const fd = new FormData(); fd.append("image", file);
            const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
            const d = await res.json();
            myData = { name, photo: d.data.url, timestamp: Date.now() };
            localStorage.setItem("smart_user_v2", JSON.stringify(myData));
            location.reload();
        }

        function handleMultiPreview(input) {
            const list = document.getElementById('previewList');
            list.innerHTML = "";
            Array.from(input.files).slice(0, 4).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const item = document.createElement('div');
                    item.className = "preview-item";
                    const media = file.type.startsWith('video') ? `<video src="${e.target.result}"></video>` : `<img src="${e.target.result}">`;
                    item.innerHTML = `${media} <input type="text" class="caption-input" id="cap-${index}" placeholder="විස්තරයක් ලියන්න...">`;
                    list.appendChild(item);
                }
                reader.readAsDataURL(file);
            });
        }

        function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

        async function postMulti() {
            const files = document.getElementById('fileInp').files, btn = document.getElementById('postBtn');
            if(files.length === 0) return alert("වීඩියෝ එකක් තෝරන්න!");

            btn.disabled = true; 
            document.getElementById('progCont').style.display = 'block';
            document.getElementById('percentLabel').style.display = 'block';
            document.getElementById('cancelBtn').style.display = 'none';

            // Sequential Upload (එකින් එක පිළිවෙලට)
            for(let i=0; i < Math.min(files.length, 4); i++) {
                const file = files[i];
                const caption = document.getElementById(`cap-${i}`).value;
                let fd = new FormData();
                let isImg = file.type.startsWith('image');
                let uploadUrl = isImg ? "https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160" : "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
                
                if(isImg) fd.append("image", file);
                else { fd.append("file", file); fd.append("upload_preset", "Yuresh_preset"); }

                document.getElementById('percentLabel').innerText = `Uploading ${i+1}/${files.length}...`;
                document.getElementById('progBar').style.width = ((i / files.length) * 100) + "%";

                try {
                    const res = await fetch(uploadUrl, { method: "POST", body: fd });
                    const d = await res.json();
                    const finalUrl = isImg ? d.data.url : d.secure_url;

                    await db.ref('smart_notes').push({
                        uName: myData.name, uPhoto: myData.photo,
                        text: caption, url: finalUrl, fileType: isImg ? "image" : "video",
                        time: Date.now(), love: 0
                    });
                } catch(e) { console.error("Upload failed", e); }
            }

            document.getElementById('progBar').style.width = "100%";
            document.getElementById('percentLabel').innerText = "සාර්ථකයි!";
            setTimeout(() => location.reload(), 1000);
        }

        db.ref('smart_notes').limitToLast(20).on('value', snap => {
            const feed = document.getElementById('notesFeed');
            snap.forEach(c => {
                const id = c.key, d = c.val();
                if(!document.getElementById('card-'+id)) {
                    let media = d.url ? (d.fileType === "video" ? `<div class="media-box"><video src="${d.url}" controls playsinline></video></div>` : `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`) : "";
                    feed.insertAdjacentHTML('afterbegin', `<div class="note-card" id="card-${id}">
                        <div class="user-info"><img src="${d.uPhoto}" class="p-img" style="width:32px; height:32px; border-radius:50%; object-fit:cover;"><span class="u-name">${d.uName}</span></div>
                        <div style="padding:5px 0; font-size:15px; color:#ccc;">${d.text || ""}</div>${media}
                        <div class="react-bar"><button class="react-btn" onclick="db.ref('smart_notes/${id}/love').transaction(c=>(c||0)+1)">❤️ <span id="react-${id}">${d.love||0}</span></button></div>
                    </div>`);
                } else { document.getElementById('react-'+id).innerText = d.love || 0; }
            });
        });
    </script>
</body>
</html>
