<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Secure System - Locked</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #050505; --card: #121212; --primary: #30d158; --text: #fff; --admin: #ff3b30; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; overflow: hidden; }
        .overlay { position: fixed; inset: 0; background: #000; z-index: 9000; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; }
        .input-box { padding: 14px; border-radius: 12px; border: 1px solid #333; width: 80%; margin-bottom: 15px; background: #111; color: #fff; text-align: center; font-size: 16px; outline: none; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 14px 45px; border-radius: 25px; font-weight: 700; cursor: pointer; }
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px; box-sizing: border-box; display: none; }
        .timer-info { font-size: 11px; color: var(--primary); margin-bottom: 10px; background: rgba(48,209,88,0.1); padding: 5px 10px; border-radius: 8px; width: fit-content; }
        .note-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 0.5px solid #222; }
        .fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); border: none; font-size: 25px; color: #fff; z-index: 1000; display: none; }
    </style>
</head>
<body>

<div id="blocker" class="overlay" style="display:none;">
    <h2 id="blockMsg">සර්වර් එක පිරී ඇත (100/100)</h2>
    <p id="subMsg">කරුණාකර පසුව උත්සාහ කරන්න.</p>
    <button onclick="showAdminLogin()" style="background:none; border:none; color:#333; margin-top:50px; font-size:10px;">Admin Login</button>
</div>

<div id="setup" class="overlay" style="display:none;">
    <h2 style="color:var(--primary)">Smart Access</h2>
    <input type="text" id="uName" class="input-box" placeholder="ඔබේ නම...">
    <button class="btn" onclick="startSession()">ඇතුල් වන්න</button>
    <p style="font-size:10px; color:gray; margin-top:20px;">සීමාව: පැය 1 | විවේකය: පැය 5</p>
</div>

<div id="adminPanel" class="overlay" style="display:none;">
    <h2 style="color:var(--admin)">Admin Verification</h2>
    <input type="password" id="adminKey" class="input-box" placeholder="Secret Key...">
    <button class="btn" style="background:var(--admin)" onclick="verifyAdmin()">Unlock System</button>
    <button onclick="location.reload()" style="background:none; border:none; color:gray; margin-top:15px;">Back</button>
</div>

<div class="scroll-container" id="appContent">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="timer-info" id="sessionTimer">Session: --:--</div>
        <button onclick="exitApp()" style="background:none; border:none; color:gray; font-size:12px;">Logout</button>
    </div>
    <div id="notesFeed"></div>
</div>

<button class="fab" id="addBtn" onclick="alert('Post Function can be added here!')">+</button>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_PASS = "Yuresh@2026"; // ඔයාගේ රහස් Key එක මෙතන තියෙන්නේ
    const ONE_HOUR = 60 * 60 * 1000;
    const FIVE_HOURS = 5 * 60 * 60 * 1000;

    let myUser = JSON.parse(localStorage.getItem("secure_user"));

    async function checkAccess() {
        // 1. Admin ද කියලා බලනවා (Admin ට සීමා නැත)
        if (myUser && myUser.isAdmin) {
            enterApp();
            return;
        }

        // 2. Cooldown Check (පැය 5 සීමාව)
        if (myUser && myUser.lastExit) {
            const timePassed = Date.now() - myUser.lastExit;
            if (timePassed < FIVE_HOURS) {
                const wait = Math.ceil((FIVE_HOURS - timePassed) / (60 * 1000));
                showBlock("Access Denied", `ඔබේ විවේක කාලය ක්‍රියාත්මකයි. තව මිනිත්තු ${wait} කින් උත්සාහ කරන්න.`);
                return;
            }
        }

        // 3. 100 Users Limit Check
        const snap = await db.ref('online_users').once('value');
        if (snap.numChildren() >= 100) {
            showBlock("Server Full", "දැනට උපරිම සීමාව (100) කරා ළඟා වී ඇත.");
            return;
        }

        // 4. Login එක පෙන්වනවා
        if (!myUser || !myUser.startTime) {
            document.getElementById('setup').style.display = 'flex';
        } else {
            enterApp();
        }
    }

    function showBlock(title, msg) {
        document.getElementById('blocker').style.display = 'flex';
        document.getElementById('blockMsg').innerText = title;
        document.getElementById('subMsg').innerText = msg;
    }

    function showAdminLogin() {
        document.getElementById('blocker').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'flex';
    }

    function verifyAdmin() {
        const key = document.getElementById('adminKey').value;
        if (key === ADMIN_PASS) {
            myUser = { id: "admin_1", name: "Owner", isAdmin: true, startTime: Date.now() };
            localStorage.setItem("secure_user", JSON.stringify(myUser));
            location.reload();
        } else {
            alert("වැරදි Key එකක්!");
        }
    }

    async function startSession() {
        const name = document.getElementById('uName').value;
        if (!name) return;
        myUser = { id: "u_" + Date.now(), name: name, startTime: Date.now(), isAdmin: false };
        localStorage.setItem("secure_user", JSON.stringify(myUser));
        enterApp();
    }

    function enterApp() {
        document.getElementById('setup').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('blocker').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        document.getElementById('addBtn').style.display = 'block';

        db.ref('online_users/' + myUser.id).set({ name: myUser.name, lastSeen: Date.now() });
        db.ref('online_users/' + myUser.id).onDisconnect().remove();

        if (!myUser.isAdmin) {
            const timeLeft = ONE_HOUR - (Date.now() - myUser.startTime);
            if (timeLeft <= 0) { exitApp(); return; }
            startTimer(timeLeft);
        } else {
            document.getElementById('sessionTimer').innerText = "Admin Mode: Unlimited Access";
            document.getElementById('sessionTimer').style.color = "var(--admin)";
        }
        loadFeed();
    }

    function startTimer(timer) {
        const display = document.getElementById('sessionTimer');
        const interval = setInterval(() => {
            const mins = Math.floor(timer / 60000);
            const secs = Math.floor((timer % 60000) / 1000);
            display.innerText = `Time Left: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
            timer -= 1000;
            if (timer <= 0) { clearInterval(interval); exitApp(); }
        }, 1000);
    }

    async function exitApp() {
        if (myUser && !myUser.isAdmin) {
            myUser.lastExit = Date.now();
            myUser.startTime = null;
            localStorage.setItem("secure_user", JSON.stringify(myUser));
        } else if(myUser.isAdmin) {
            localStorage.removeItem("secure_user"); // Admin Logout
        }
        await db.ref('online_users/' + myUser.id).remove();
        location.reload();
    }

    function loadFeed() {
        db.ref('smart_notes').limitToLast(20).on('value', snap => {
            const feed = document.getElementById('notesFeed');
            feed.innerHTML = "";
            snap.forEach(c => {
                const d = c.val();
                feed.innerHTML = `<div class="note-card"><b>${d.uName}</b><p>${d.text || ""}</p></div>` + feed.innerHTML;
            });
        });
    }

    checkAccess();
</script>
</body>
</html>
