<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes - Ultimate Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #000; --card: rgba(35, 35, 35, 0.5); --text: #eee; --primary: #30d158; --border: rgba(255, 255, 255, 0.1); 
            --glass: blur(20px) saturate(180%);
        }
        body[data-theme="1"] { --bg: #f2f2f7; --card: rgba(255, 255, 255, 0.6); --text: #1c1c1e; --border: rgba(0, 0, 0, 0.1); --primary: #007aff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; transition: 0.5s ease; overflow: hidden; }
        
        #welcomeScreen { position: fixed; inset: 0; background: var(--bg); z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .profile-upload { width: 90px; height: 90px; background: #333; border-radius: 50%; overflow: hidden; margin-bottom: 20px; border: 2.5px solid var(--primary); cursor: pointer; }
        .profile-upload img { width: 100%; height: 100%; object-fit: cover; }
        
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 10px 100px 10px; box-sizing: border-box; }
        
        /* Search Bar Styling */
        .search-box { background: var(--card); border: 0.5px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .search-box input { background: none; border: none; color: var(--text); flex: 1; outline: none; font-size: 14px; }

        .note-card { background: var(--card); backdrop-filter: var(--glass); border-radius: 14px; padding: 12px; margin-bottom: 15px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .user-info div { display: flex; flex-direction: column; }
        .p-img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .time-tag { font-size: 10px; opacity: 0.5; }

        .media-container { width: 100%; border-radius: 10px; overflow: hidden; background: #111; margin-bottom: 8px; max-height: 250px; display: flex; align-items: center; }
        .media-content { width: 100%; height: auto; max-height: 250px; object-fit: cover; }
        
        #chatBox { position: fixed; bottom: 85px; right: 15px; width: 300px; height: 420px; background: var(--card); backdrop-filter: var(--glass); z-index: 2000; display: none; flex-direction: column; border-radius: 20px; border: 0.5px solid var(--border); }
        #chatLogs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        
        .fab { position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: #fff; z-index: 1000; font-size: 22px; cursor: pointer; }
        .ios-btn { color: var(--primary); background: none; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body data-theme="2">

<div id="welcomeScreen">
    <h3 style="color:white">Setup Profile</h3>
    <label for="pUpload" class="profile-upload"><img id="pPreview" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
    <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewProfile(this)">
    <input type="text" id="pName" placeholder="Your Name" style="width:70%; padding:10px; border-radius:10px; border:none; margin-bottom:15px; text-align:center;">
    <button onclick="saveProfile()" style="background:var(--primary); color:white; border:none; padding:12px 40px; border-radius:25px; font-weight:700;">Start</button>
</div>

<div class="scroll-container" id="mainScroll">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h1 style="font-size: 24px; font-weight: 800; margin: 0;">Smart Notes</h1>
        <button onclick="nextTheme()" class="ios-btn">Theme</button>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search notes or users..." oninput="searchNotes()">
    </div>

    <button onclick="toggleInput()" style="width:100%; background:var(--primary); color:#fff; border:none; padding:12px; border-radius:12px; font-weight:700; margin-bottom:15px;">+ New Note</button>

    <div id="inputSection" style="display:none; background:var(--card); padding:12px; border-radius:14px; margin-bottom:20px; border: 0.5px solid var(--border);">
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;">
        <label for="fileInput" style="color:var(--primary); cursor:pointer; font-size: 13px;">📷 Upload Media</label>
        <textarea id="noteInput" placeholder="What's on your mind?" style="width:100%; background:none; border:none; color:var(--text); font-size:14px; min-height:60px; outline:none; margin-top:10px; resize:none;"></textarea>
        <button id="submitBtn" onclick="saveNote()" style="width:100%; background:var(--primary); color:#fff; border:none; padding:10px; border-radius:10px; font-weight:700;">Post Now</button>
    </div>

    <div id="notesFeed"></div>
    <button id="loadMoreBtn" style="width:100%; background:none; border:1px solid var(--primary); color:var(--primary); padding:10px; border-radius:10px; cursor:pointer; margin-top:10px;" onclick="loadPreviousNotes()">Load More</button>
</div>

<button class="fab" onclick="openChat()">💬</button>

<div id="chatBox">
    <div style="padding:12px; border-bottom:0.5px solid var(--border); display:flex; justify-content:space-between;">
        <b>Community Chat</b>
        <button onclick="closeChat()" class="ios-btn">Close</button>
    </div>
    <div id="chatLogs"></div>
    <div style="padding:10px; display:flex; gap:5px;">
        <input type="text" id="chatInput" placeholder="Message..." style="flex:1; background:rgba(255,255,255,0.08); border:none; padding:8px 12px; border-radius:18px; color:#fff; outline:none; font-size:13px;">
        <button onclick="sendChat()" style="background:none; border:none; color:var(--primary); font-size:18px;">➤</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myData = JSON.parse(localStorage.getItem("smart_user"));
    if(!myData) { document.getElementById('welcomeScreen').style.display = 'flex'; }

    let allNotes = []; // Search කිරීමට සියලුම නෝට්ස් මෙහි තබා ගනිමු
    let lastLoadedKey = null;

    function previewProfile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('pPreview').src = e.target.result; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function saveProfile() {
        const name = document.getElementById('pName').value, file = document.getElementById('pUpload').files[0];
        if(!name || !file) return alert("All fields required!");
        const fd = new FormData(); fd.append("image", file);
        const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", { method: "POST", body: fd });
        const d = await res.json();
        myData = { name, photo: d.data.url };
        localStorage.setItem("smart_user", JSON.stringify(myData));
        document.getElementById('welcomeScreen').style.display = 'none';
        location.reload();
    }

    // Time Ago Function (සිංහලෙන් හෝ ඉංග්‍රීසියෙන්)
    function timeAgo(timestamp) {
        const seconds = Math.floor((new Date() - timestamp) / 1000);
        let interval = Math.floor(seconds / 31536000);
        if (interval > 1) return interval + " years ago";
        interval = Math.floor(seconds / 2592000);
        if (interval > 1) return interval + " months ago";
        interval = Math.floor(seconds / 86400);
        if (interval > 1) return interval + " days ago";
        interval = Math.floor(seconds / 3600);
        if (interval > 1) return interval + " hours ago";
        interval = Math.floor(seconds / 60);
        if (interval > 1) return interval + " mins ago";
        return "Just now";
    }

    function renderNote(n, k, container) {
        const uImg = n.uPhoto || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const timeDisplay = n.time ? timeAgo(n.time) : "Long ago";
        let media = "";
        if(n.url) {
            if(n.fileType === "video") media = `<div class="media-container"><video src="${n.url}" class="media-content" controls preload="none"></video></div>`;
            else media = `<div class="media-container"><img src="${n.url}" class="media-content" loading="lazy"></div>`;
        }
        return `
            <div class="note-card">
                <div class="user-info">
                    <img src="${uImg}" class="p-img">
                    <div><b>${n.uName || 'User'}</b><span class="time-tag">${timeDisplay}</span></div>
                </div>
                ${media}
                <div style="font-size:13px; margin-bottom:8px;">${n.text || ""}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button class="ios-btn" onclick="db.ref('smart_notes/${k}/likes').transaction(l=>(l||0)+1)">🔥 ${n.likes || 0}</button>
                    <button class="ios-btn" style="color:#ff3b30; font-size:11px;" onclick="if(confirm('Delete?')) db.ref('smart_notes/${k}').remove()">Delete</button>
                </div>
            </div>`;
    }

    // Load Notes
    db.ref('smart_notes').limitToLast(20).on('value', snap => {
        allNotes = [];
        const feed = document.getElementById('notesFeed');
        let html = "";
        snap.forEach(c => {
            const data = c.val();
            allNotes.push({key: c.key, data: data});
            if(!lastLoadedKey) lastLoadedKey = c.key;
        });
        const displayNotes = [...allNotes].reverse();
        displayNotes.forEach(item => { html += renderNote(item.data, item.key); });
        feed.innerHTML = html;
    });

    // Search Logic
    function searchNotes() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const feed = document.getElementById('notesFeed');
        let html = "";
        const filtered = allNotes.filter(item => 
            (item.data.text && item.data.text.toLowerCase().includes(query)) || 
            (item.data.uName && item.data.uName.toLowerCase().includes(query))
        ).reverse();
        filtered.forEach(item => { html += renderNote(item.data, item.key); });
        feed.innerHTML = html;
        document.getElementById('loadMoreBtn').style.display = query ? "none" : "block";
    }

    async function saveNote() {
        const text = document.getElementById('noteInput').value, file = document.getElementById('fileInput').files[0], btn = document.getElementById('submitBtn');
        btn.disabled = true;
        let url = "", type = "text";
        if(file) {
            let fd = new FormData();
            if(file.type.startsWith('image/')) {
                fd.append("image", file);
                const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", { method: "POST", body: fd });
                const d = await res.json(); url = d.data.url; type = "image";
            } else {
                fd.append("file", file); fd.append("upload_preset", "Yuresh_preset");
                const res = await fetch("https://api.cloudinary.com/v1_1/ds5ig0wvd/upload", { method: "POST", body: fd });
                const d = await res.json(); url = d.secure_url; type = "video";
            }
        }
        await db.ref('smart_notes').push({ text, url, fileType: type, likes: 0, uName: myData.name, uPhoto: myData.photo, time: Date.now() });
        btn.disabled = false; document.getElementById('inputSection').style.display = "none";
        document.getElementById('noteInput').value = ""; document.getElementById('fileInput').value = "";
    }

    function nextTheme() { const b = document.body; b.setAttribute('data-theme', b.getAttribute('data-theme') == "1" ? "2" : "1"); }
    function toggleInput() { const s = document.getElementById('inputSection'); s.style.display = s.style.display === "none" ? "block" : "none"; }
    function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
    function closeChat() { document.getElementById('chatBox').style.display = 'none'; }
    function sendChat() {
        const i = document.getElementById('chatInput');
        if(i.value) { db.ref('community_chat').push({ name: myData.name, photo: myData.photo, msg: i.value }); i.value = ""; }
    }
    db.ref('community_chat').limitToLast(15).on('value', s => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => {
            const d = c.val(); const isMe = d.name === myData.name;
            l.innerHTML += `<div style="display:flex; gap:5px; margin-bottom:8px; ${isMe?'flex-direction:row-reverse':''}">
                <div style="background:${isMe? 'var(--primary)':'rgba(255,255,255,0.1)'}; padding:6px 12px; border-radius:12px; font-size:12px; max-width:75%;">
                    <b>${isMe?'You':d.name}</b><br>${d.msg}
                </div>
            </div>`;
        });
        l.scrollTop = l.scrollHeight;
    });
</script>
</body>
</html>
