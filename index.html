<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Notes Sri Lanka - Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --primary: #4f46e5; --text: #fff; --border: #333; --red: #ff4d4d; }
        body[data-theme="light"] { --bg: #f0f2f5; --card: #fff; --text: #000; --border: #ddd; }
        
        /* Security: Disable Copy & Zoom */
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; 
            user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y; 
        }

        .container { max-width: 500px; margin: auto; padding-bottom: 100px; }
        
        /* Notification Toast */
        #notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 12px 20px;
            border-radius: 30px; z-index: 2000; transition: 0.5s; font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 80%; text-align: center;
        }

        .note-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .media-container { width: 100%; margin-bottom: 12px; border-radius: 10px; overflow: hidden; background: #000; }
        .media-content { width: 100%; max-height: 400px; display: block; object-fit: contain; }

        .note-footer { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 12px; }
        
        .btn-group { display: flex; gap: 8px; }
        .text-btn { background: #1e1e1e; color: #aaa; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .like-btn { background: transparent; border: 1px solid var(--border); color: #fff; display: flex; align-items: center; gap: 5px; }
        .like-btn.active { color: var(--red); border-color: var(--red); }

        /* Full Screen Chat Box */
        #chatBox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); z-index: 1500; display: none; flex-direction: column; 
        }
        #chatLogs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; background: #222; align-self: flex-start; }
        .msg.me { align-self: flex-end; background: var(--primary); }

        .fab-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
        .fab { width: 60px; height: 60px; border-radius: 50%; background: var(--primary); border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="notification">නව පණිවිඩයක් ලැබුණා! 💬</div>

<div class="container">
    <div class="header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <div style="background:orange; padding:5px 12px; border-radius:20px; font-weight:bold; color:#000;">Smart Notes</div>
        <button class="text-btn" onclick="cycleThemes()">THEME</button>
    </div>

    <input type="text" id="searchInput" style="width:100%; padding:12px; border-radius:10px; background:var(--card); color:#fff; border:1px solid var(--border); margin-bottom:15px;" placeholder="සොයන්න..." onkeyup="searchNotes()">
    
    <button class="main-btn" style="width:100%; padding:15px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-weight:bold;" onclick="toggleInput()">ADD NEW NOTE</button>

    <div id="inputSection" style="display:none; margin-top:15px; background:var(--card); padding:15px; border-radius:15px; border:1px solid var(--border);">
        <textarea id="noteInput" rows="4" style="width:100%; background:#000; color:#fff; border:1px solid var(--border); padding:10px; border-radius:10px;" placeholder="සටහන..."></textarea>
        <button id="submitBtn" onclick="saveNote()" style="width:100%; margin-top:10px; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:10px;">SAVE</button>
    </div>

    <div id="notesFeed" style="margin-top:20px;"></div>
</div>

<div class="fab-container">
    <button class="fab" onclick="openChat()">💬</button>
</div>

<div id="chatBox">
    <div style="padding:15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold;">Community Chat</span>
        <button onclick="closeModals()" style="background:none; border:none; color:#fff; font-size:20px;">✕</button>
    </div>
    <div id="chatLogs"></div>
    <div style="padding:15px; display:flex; gap:10px; background:var(--card);">
        <input type="text" id="chatInput" style="flex:1; padding:12px; border-radius:25px; background:#000; color:#fff; border:1px solid var(--border);" placeholder="පණිවිඩයක් ලියන්න...">
        <button onclick="sendChat()" style="background:var(--primary); border:none; color:#fff; padding:0 20px; border-radius:25px;">➜</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let isChatOpen = false;

    // Like System
    function toggleLike(id) {
        const ref = db.ref('smart_notes/' + id + '/likes');
        ref.transaction(current => (current || 0) + 1);
    }

    // Copy System
    function copyText(text) {
        navigator.clipboard.writeText(text);
        showToast("සටහන Copy කරගත්තා! ✅");
    }

    function showToast(msg) {
        const t = document.getElementById('notification');
        t.innerText = msg; t.style.top = "20px";
        setTimeout(() => t.style.top = "-100px", 3000);
    }

    // Load Notes
    db.ref('smart_notes').on('value', snap => {
        const feed = document.getElementById('notesFeed'); feed.innerHTML = "";
        snap.forEach(child => {
            const n = child.val(), k = child.key;
            let media = n.url ? (n.fileType === "video" ? `<video src="${n.url}" class="media-content" controls></video>` : `<img src="${n.url}" class="media-content">`) : "";
            
            const div = document.createElement('div'); div.className = 'note-card';
            div.innerHTML = `
                <div class="media-container">${media}</div>
                <div style="font-size:15px; margin-bottom:10px;">${n.text}</div>
                <div class="note-footer">
                    <button class="text-btn like-btn" onclick="toggleLike('${k}')">❤️ ${n.likes || 0}</button>
                    <div class="btn-group">
                        <button class="text-btn" onclick="copyText(\`${n.text}\`)">COPY</button>
                        <button class="text-btn" onclick="deleteNote('${k}')" style="color:var(--red)">DELETE</button>
                    </div>
                </div>`;
            feed.prepend(div);
        });
    });

    // Chat Notification
    db.ref('community_chat').limitToLast(1).on('child_added', snap => {
        if(!isChatOpen) showToast("Chat: " + snap.val().msg);
        updateChatLogs();
    });

    function updateChatLogs() {
        db.ref('community_chat').limitToLast(20).once('value', s => {
            const l = document.getElementById('chatLogs'); l.innerHTML = "";
            s.forEach(c => { l.innerHTML += `<div class="msg"><b>${c.val().name}:</b> ${c.val().msg}</div>`; });
            l.scrollTop = l.scrollHeight;
        });
    }

    function openChat() { document.getElementById('chatBox').style.display = 'flex'; isChatOpen = true; }
    function closeModals() { document.getElementById('chatBox').style.display = 'none'; isChatOpen = false; }
    function sendChat() {
        const i = document.getElementById('chatInput');
        if(i.value.trim()) { db.ref('community_chat').push({ name: "User", msg: i.value }); i.value = ""; }
    }
    
    function toggleInput() { const s = document.getElementById('inputSection'); s.style.display = s.style.display === "none" ? "block" : "none"; }
    function cycleThemes() { document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }
    function deleteNote(id) { if(confirm("මැකීමට අවශ්‍යද?")) db.ref('smart_notes/' + id).remove(); }
</script>
</body>
</html>
