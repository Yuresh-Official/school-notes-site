<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes SL - Background Sync</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #151517; --text: #fff; --primary: #30d158; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 15px 120px 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        .note-card { width: 100%; max-width: 360px; background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 18px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .media-box { width: 100%; margin: 10px 0; border-radius: 12px; overflow: hidden; background: #000; }
        .media-box video, .media-box img { width: 100%; height: auto; max-height: 500px; display: block; }

        /* Background Upload Status Overlay */
        #uploadToast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1c1c1e; border: 1px solid var(--primary); padding: 12px 20px; border-radius: 30px; display: none; align-items: center; gap: 12px; z-index: 6000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 28px; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        
        #previewList { width: 100%; margin-top: 15px; max-height: 250px; overflow-y: auto; }
        .preview-item { display: flex; gap: 10px; background: #111; padding: 8px; border-radius: 10px; margin-bottom: 8px; align-items: center; }
        .preview-item img, .preview-item video { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
        .caption-input { flex: 1; background: #222; border: none; color: #fff; padding: 8px; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>

    <div id="uploadToast">
        <div class="spinner"></div>
        <span id="toastText" style="font-size: 14px; font-weight: bold;">Uploading...</span>
    </div>

    <div class="scroll-container">
        <h2 style="width: 100%; max-width: 360px; margin-bottom: 15px;">Smart Feed</h2>
        <div id="notesFeed" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <button class="fab" onclick="toggleAdd()">+</button>

    <div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:4000; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
        <div style="width: 100%; max-width: 380px; text-align: center;">
            <input type="file" id="fileInp" accept="image/*,video/*" multiple onchange="handleMultiPreview(this)" style="color:gray; font-size:12px;">
            <div id="previewList"></div>
            <button id="postBtn" onclick="postMulti()" style="width: 100%; background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700; margin-top:15px;">සියල්ල පළ කරන්න</button>
            <button onclick="toggleAdd()" style="background:none; border:none; color:gray; margin-top:10px;">අතහරින්න</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isUploading = false;
        let myData = JSON.parse(localStorage.getItem("smart_user_v2"));

        // Warning before leaving if upload is active
        window.onbeforeunload = function() {
            if (isUploading) return "වීඩියෝ අප්ලෝඩ් වෙමින් පවතී. පිටවීමට අවශ්‍යද?";
        };

        function handleMultiPreview(input) {
            const list = document.getElementById('previewList');
            list.innerHTML = "";
            Array.from(input.files).slice(0, 4).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = e => {
                    list.innerHTML += `<div class="preview-item">
                        ${file.type.startsWith('video') ? `<video src="${e.target.result}"></video>` : `<img src="${e.target.result}">`}
                        <input type="text" class="caption-input" id="cap-${index}" placeholder="Description...">
                    </div>`;
                };
                reader.readAsDataURL(file);
            });
        }

        function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

        async function postMulti() {
            const files = document.getElementById('fileInp').files;
            if(files.length === 0) return;

            isUploading = true;
            toggleAdd(); // Close the input box immediately so user can browse feed
            const toast = document.getElementById('uploadToast');
            toast.style.display = 'flex';

            for(let i=0; i < Math.min(files.length, 4); i++) {
                const file = files[i];
                const caption = document.getElementById(`cap-${i}`).value;
                document.getElementById('toastText').innerText = `Uploading ${i+1}/${files.length}...`;

                let fd = new FormData();
                let isImg = file.type.startsWith('image');
                let url = isImg ? "https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160" : "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
                
                if(isImg) fd.append("image", file);
                else { fd.append("file", file); fd.append("upload_preset", "Yuresh_preset"); }

                try {
                    const res = await fetch(url, { method: "POST", body: fd });
                    const d = await res.json();
                    const finalUrl = isImg ? d.data.url : d.secure_url;

                    await db.ref('smart_notes').push({
                        uName: myData.name, uPhoto: myData.photo,
                        text: caption, url: finalUrl, fileType: isImg ? "image" : "video",
                        time: Date.now(), love: 0
                    });
                } catch(e) { console.log("Skip error"); }
            }

            isUploading = false;
            toast.innerHTML = "✅ සියල්ල සාර්ථකයි!";
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        db.ref('smart_notes').limitToLast(15).on('value', snap => {
            const feed = document.getElementById('notesFeed');
            snap.forEach(c => {
                const id = c.key, d = c.val();
                if(!document.getElementById('card-'+id)) {
                    let media = d.url ? (d.fileType === "video" ? `<div class="media-box"><video src="${d.url}" controls playsinline preload="none"></video></div>` : `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`) : "";
                    feed.insertAdjacentHTML('afterbegin', `<div class="note-card" id="card-${id}">
                        <div class="user-info"><img src="${d.uPhoto}" class="p-img"><span class="u-name">${d.uName}</span></div>
                        <div style="font-size:14px; color:#ccc;">${d.text || ""}</div>${media}
                        <div class="react-bar"><button class="react-btn" onclick="db.ref('smart_notes/${id}/love').transaction(c=>(c||0)+1)">❤️ <span id="react-${id}">${d.love||0}</span></button></div>
                    </div>`);
                } else { document.getElementById('react-'+id).innerText = d.love || 0; }
            });
        });
    </script>
</body>
</html>
