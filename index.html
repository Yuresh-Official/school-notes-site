<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes - Stable Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #0b0b0b; --card: #1c1c1e; --text: #ffffff; --primary: #30d158; --border: rgba(255, 255, 255, 0.1); 
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 12px 100px 12px; box-sizing: border-box; }
        
        /* Note Card Optimization */
        .note-card { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 16px; border: 0.5px solid var(--border); }
        
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #333; }
        .u-name { font-weight: 700; font-size: 14px; }
        .time-tag { font-size: 10px; opacity: 0.5; margin-left: 5px; }

        /* Media Box - ඔයා කියපු විදිහට සම්පූර්ණ දර්ශනය පේන විදිහට */
        .media-box { 
            width: 100%; 
            background: #000; 
            border-radius: 12px; 
            margin: 8px 0; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 400px; /* ඕනෑවට වඩා ලොකු වෙන්න බෑ */
        }
        .media-box img, .media-box video { 
            max-width: 100%; 
            max-height: 400px; 
            display: block;
            object-fit: contain; /* සම්පූර්ණ පින්තූරය/වීඩියෝව පේන්න */
        }

        /* React Bar */
        .react-bar { display: flex; gap: 8px; padding-top: 10px; border-top: 0.5px solid var(--border); }
        .react-btn { 
            background: rgba(255,255,255,0.08); 
            border: none; 
            padding: 6px 12px; 
            border-radius: 20px; 
            color: #fff; 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            transition: 0.1s;
        }
        .react-btn:active { transform: scale(0.9); }

        .search-bar { 
            width: 100%; padding: 10px; border-radius: 10px; background: #222; 
            border: 1px solid var(--border); color: #fff; margin-bottom: 15px; box-sizing: border-box;
        }

        .fab { position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 24px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

<div class="scroll-container" id="feedScroll">
    <h1 style="font-size: 22px; margin-bottom: 15px;">Smart Feed</h1>
    <input type="text" class="search-bar" placeholder="🔍 සොයන්න..." id="searchInp" oninput="doSearch()">
    <div id="notesFeed"></div>
</div>

<button class="fab" onclick="toggleAdd()">+</button>

<div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; padding:20px; display:none; flex-direction:column; justify-content:center;">
    <textarea id="noteTxt" placeholder="මොනවා හරි ලියන්න..." style="width:100%; height:150px; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; margin-bottom:15px;"></textarea>
    <input type="file" id="fileInp" accept="image/*,video/*" style="margin-bottom:15px;">
    <button onclick="postNote()" id="pBtn" style="background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700;">පළ කරන්න (Post)</button>
    <button onclick="toggleAdd()" style="background:none; border:none; color:gray; margin-top:15px;">Close</button>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myName = localStorage.getItem("u_name") || prompt("ඔබේ නම ඇතුළත් කරන්න:");
    if(myName) localStorage.setItem("u_name", myName);

    function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

    async function postNote() {
        const text = document.getElementById('noteTxt').value;
        const file = document.getElementById('fileInp').files[0];
        const btn = document.getElementById('pBtn');
        if(!text && !file) return;
        
        btn.disabled = true; btn.innerText = "Uploading...";
        let url = "", type = "text";

        if(file) {
            let fd = new FormData();
            if(file.type.startsWith('image')) {
                fd.append("image", file);
                const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
                const d = await res.json(); url = d.data.url; type = "image";
            } else {
                fd.append("file", file); fd.append("upload_preset", "Yuresh_preset");
                const res = await fetch("https://api.cloudinary.com/v1_1/ds5ig0wvd/upload", {method:"POST", body:fd});
                const d = await res.json(); url = d.secure_url; type = "video";
            }
        }

        await db.ref('smart_notes').push({
            uName: myName, text, url, fileType: type, time: Date.now(),
            reacts: { love: 0, haha: 0, fire: 0 }
        });
        location.reload();
    }

    // --- වීඩියෝ රීසෙට් නොවී රියැක්ට් අප්ඩේට් කිරීමේ සිස්ටම් එක ---
    db.ref('smart_notes').limitToLast(20).on('value', snap => {
        const feed = document.getElementById('notesFeed');
        snap.forEach(c => {
            const id = c.key;
            const data = c.val();
            const existingCard = document.getElementById('card-' + id);

            if (existingCard) {
                // වීඩියෝ එක රීසෙට් නොවී React Counts විතරක් අප්ඩේට් කරනවා
                existingCard.querySelector('.love-count').innerText = data.reacts?.love || 0;
                existingCard.querySelector('.haha-count').innerText = data.reacts?.haha || 0;
                existingCard.querySelector('.fire-count').innerText = data.reacts?.fire || 0;
            } else {
                // අලුත් කාඩ් එකක් නම් විතරක් මුලට එකතු කරනවා
                let media = "";
                if(data.url) {
                    if(data.fileType === "video") media = `<div class="media-box"><video src="${data.url}" controls preload="metadata" playsinline></video></div>`;
                    else media = `<div class="media-box"><img src="${data.url}" loading="lazy"></div>`;
                }

                const html = `
                <div class="note-card" id="card-${id}">
                    <div class="user-info">
                        <img src="https://ui-avatars.com/api/?name=${data.uName}&background=random" class="p-img">
                        <span class="u-name">${data.uName}</span>
                        <span class="time-tag">Just now</span>
                    </div>
                    <div style="font-size:14px; margin-bottom:5px;">${data.text || ""}</div>
                    ${media}
                    <div class="react-bar">
                        <button class="react-btn" onclick="react('${id}', 'love')">❤️ <span class="love-count">${data.reacts?.love || 0}</span></button>
                        <button class="react-btn" onclick="react('${id}', 'haha')">😂 <span class="haha-count">${data.reacts?.haha || 0}</span></button>
                        <button class="react-btn" onclick="react('${id}', 'fire')">🔥 <span class="fire-count">${data.reacts?.fire || 0}</span></button>
                    </div>
                </div>`;
                feed.insertAdjacentHTML('afterbegin', html);
            }
        });
    });

    function react(id, type) {
        db.ref(`smart_notes/${id}/reacts/${type}`).transaction(c => (c || 0) + 1);
    }

    function doSearch() {
        const q = document.getElementById('searchInp').value.toLowerCase();
        document.querySelectorAll('.note-card').forEach(c => {
            c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
