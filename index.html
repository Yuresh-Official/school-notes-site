<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes - Ultimate Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --text: #fff; --primary: #30d158; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
        
        /* Profile Setup Screen */
        #welcomeScreen { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .p-setup-img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; margin-bottom: 15px; cursor: pointer; }

        .scroll-container { height: 100vh; overflow-y: auto; padding: 15px 12px 100px 12px; box-sizing: border-box; }
        .note-card { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 16px; border: 0.5px solid var(--border); }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .p-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #333; }
        
        /* Media Full View Optimization */
        .media-box { width: 100%; background: #000; border-radius: 12px; margin: 8px 0; overflow: hidden; display: flex; justify-content: center; max-height: 450px; }
        .media-box img, .media-box video { max-width: 100%; max-height: 450px; object-fit: contain; display: block; }

        .react-bar { display: flex; gap: 8px; padding-top: 10px; border-top: 0.5px solid var(--border); }
        .react-btn { background: rgba(255,255,255,0.08); border: none; padding: 6px 12px; border-radius: 20px; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 5px; }

        /* Chat UI */
        #chatBox { position: fixed; bottom: 90px; right: 15px; width: 300px; height: 400px; background: #1c1c1e; border: 0.5px solid var(--border); border-radius: 20px; display: none; flex-direction: column; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #chatLogs { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .chat-msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 15px; max-width: 80%; width: fit-content; }

        .fab { position: fixed; bottom: 25px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 24px; z-index: 1000; }
        .chat-fab { position: fixed; bottom: 25px; left: 20px; width: 55px; height: 55px; border-radius: 50%; background: #007aff; color: #fff; border: none; font-size: 24px; z-index: 1000; }
    </style>
</head>
<body>

<div id="welcomeScreen">
    <label for="pUpload"><img id="pPreview" class="p-setup-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png"></label>
    <input type="file" id="pUpload" accept="image/*" style="display:none;" onchange="previewP(this)">
    <input type="text" id="uNameInp" placeholder="ඔබේ නම..." style="width:70%; padding:12px; border-radius:10px; border:none; margin-bottom:15px; text-align:center; background:#222; color:#fff;">
    <button onclick="saveProfile()" style="background:var(--primary); color:#fff; border:none; padding:12px 40px; border-radius:20px; font-weight:700;">ඇතුල් වන්න</button>
</div>

<div class="scroll-container">
    <h1 style="font-size: 24px; margin-bottom: 15px;">Smart Feed</h1>
    <div id="notesFeed"></div>
</div>

<button class="chat-fab" onclick="toggleChat()">💬</button>
<button class="fab" onclick="toggleAdd()">+</button>

<div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:4000; padding:20px; flex-direction:column; justify-content:center;">
    <textarea id="noteTxt" placeholder="මොනවා හරි ලියන්න..." style="width:100%; height:120px; background:#111; color:#fff; border:1px solid #333; padding:15px; border-radius:15px; margin-bottom:15px; outline:none;"></textarea>
    <input type="file" id="fileInp" accept="image/*,video/*" style="color:gray; margin-bottom:15px;">
    <button id="postBtn" onclick="postNote()" style="background:var(--primary); color:#fff; border:none; padding:15px; border-radius:15px; font-weight:700;">Sync Note</button>
    <button onclick="toggleAdd()" style="background:none; border:none; color:gray; margin-top:15px;">Cancel</button>
</div>

<div id="chatBox">
    <div style="padding:10px; border-bottom:0.5px solid var(--border); font-weight:700;">Community Chat</div>
    <div id="chatLogs"></div>
    <div style="padding:10px; display:flex; gap:5px;">
        <input type="text" id="chatInp" placeholder="Type..." style="flex:1; background:#333; border:none; padding:8px; border-radius:10px; color:#fff; outline:none;">
        <button onclick="sendMsg()" style="color:var(--primary); background:none; border:none; font-weight:700;">Send</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myData = JSON.parse(localStorage.getItem("smart_user_v2"));
    if(!myData) document.getElementById('welcomeScreen').style.display = 'flex';

    function previewP(i) { if(i.files[0]) { const r = new FileReader(); r.onload=e=>document.getElementById('pPreview').src=e.target.result; r.readAsDataURL(i.files[0]); } }

    async function saveProfile() {
        const name = document.getElementById('uNameInp').value, file = document.getElementById('pUpload').files[0];
        if(!name || !file) return alert("නම සහ පින්තූරයක් අවශ්‍යයි!");
        const fd = new FormData(); fd.append("image", file);
        const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
        const d = await res.json();
        myData = { name: name, photo: d.data.url };
        localStorage.setItem("smart_user_v2", JSON.stringify(myData));
        location.reload();
    }

    function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
    function toggleChat() { const b = document.getElementById('chatBox'); b.style.display = b.style.display==='none'?'flex':'none'; }

    async function postNote() {
        const text = document.getElementById('noteTxt').value, file = document.getElementById('fileInp').files[0], btn = document.getElementById('postBtn');
        if(!text && !file) return;
        btn.disabled = true; btn.innerText = "Syncing...";
        let url = "", type = "text";
        if(file) {
            let fd = new FormData();
            if(file.type.startsWith('image')) {
                fd.append("image", file);
                const res = await fetch("https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160", {method:"POST", body:fd});
                const d = await res.json(); url = d.data.url; type = "image";
            } else {
                fd.append("file", file); fd.append("upload_preset", "Yuresh_preset");
                const res = await fetch("https://api.cloudinary.com/v1_1/ds5ig0wvd/upload", {method:"POST", body:fd});
                const d = await res.json(); url = d.secure_url; type = "video";
            }
        }
        await db.ref('smart_notes').push({ uName: myData.name, uPhoto: myData.photo, text, url, fileType: type, time: Date.now(), reacts: {love:0, fire:0} });
        location.reload();
    }

    // Stable Feed Update
    db.ref('smart_notes').limitToLast(20).on('value', snap => {
        const feed = document.getElementById('notesFeed');
        snap.forEach(c => {
            const id = c.key, d = c.val(), existing = document.getElementById('card-'+id);
            if(existing) {
                existing.querySelector('.l-cnt').innerText = d.reacts?.love || 0;
                existing.querySelector('.f-cnt').innerText = d.reacts?.fire || 0;
            } else {
                let media = "";
                if(d.url) {
                    if(d.fileType === "video") media = `<div class="media-box"><video src="${d.url}" controls preload="metadata" playsinline></video></div>`;
                    else media = `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`;
                }
                const html = `<div class="note-card" id="card-${id}">
                    <div class="user-info"><img src="${d.uPhoto}" class="p-img"><b>${d.uName}</b></div>
                    <div style="font-size:14px;">${d.text || ""}</div>${media}
                    <div class="react-bar">
                        <button class="react-btn" onclick="react('${id}','love')">❤️ <span class="l-cnt">${d.reacts?.love||0}</span></button>
                        <button class="react-btn" onclick="react('${id}','fire')">🔥 <span class="f-cnt">${d.reacts?.fire||0}</span></button>
                    </div></div>`;
                feed.insertAdjacentHTML('afterbegin', html);
            }
        });
    });

    function react(id, t) { db.ref(`smart_notes/${id}/reacts/${t}`).transaction(c=>(c||0)+1); }

    // Chat System
    function sendMsg() {
        const i = document.getElementById('chatInp');
        if(i.value) { db.ref('chat').push({ name: myData.name, msg: i.value }); i.value = ""; }
    }
    db.ref('chat').limitToLast(20).on('value', snap => {
        const logs = document.getElementById('chatLogs'); logs.innerHTML = "";
        snap.forEach(c => {
            const d = c.val();
            logs.innerHTML += `<div class="chat-msg" style="background:${d.name===myData.name?'var(--primary)':'#333'}; margin-left:${d.name===myData.name?'auto':'0'}">
                <b>${d.name}:</b> ${d.msg}</div>`;
        });
        logs.scrollTop = logs.scrollHeight;
    });
</script>
</body>
</html>
