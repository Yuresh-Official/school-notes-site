<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yuresh WhatsApp & Notes</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0b141a; --card: #121b22; --primary: #00a884; --text: #e9edef; --border: #222d34; --red: #f15c5c; --msg-in: #202c33; --msg-out: #005c4b; }
        
        body { 
            background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; 
        }

        .container { max-width: 500px; margin: auto; padding: 15px; padding-bottom: 100px; }

        /* Modern Search Bar */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-box { 
            width: 100%; padding: 12px 15px 12px 45px; border-radius: 10px; 
            background: var(--card); color: #fff; border: none; font-size: 15px; outline: none; box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 15px; top: 12px; color: #8696a0; }

        /* Note Cards */
        .note-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
        .media-content { width: 100%; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .note-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .text-btn { background: #202c33; color: #8696a0; border: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500; }

        /* WhatsApp Style Chat */
        #chatBox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0b141a; z-index: 2000; display: none; flex-direction: column; 
        }
        .chat-header { background: #202c33; padding: 10px 15px; display: flex; align-items: center; gap: 10px; color: #fff; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; background: #ccc; }
        
        #chatLogs { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-size: contain;
        }
        .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; font-size: 14px; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg.me { align-self: flex-end; background: var(--msg-out); border-top-right-radius: 0; }
        .msg.other { align-self: flex-start; background: var(--msg-in); border-top-left-radius: 0; }
        .msg img, .msg video { width: 100%; border-radius: 5px; margin-top: 5px; }

        .chat-input-area { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .chat-input-area input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 25px; color: #fff; outline: none; }
        .chat-btn { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; }
        
        #notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #00a884; color: white; padding: 10px 20px; border-radius: 20px; z-index: 3000; transition: 0.5s;
        }

        .fab { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #00a884; border: none; color: white; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

<div id="notification">Notification 🔔</div>

<div class="container">
    <h2 style="color: #00a884; margin-bottom: 20px;">Digital Diary</h2>
    
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-box" placeholder="සටහන් සොයන්න..." onkeyup="searchNotes()">
    </div>

    <button onclick="toggleInput()" style="width:100%; padding:15px; background:#00a884; border:none; border-radius:10px; color:#fff; font-weight:bold; margin-bottom:20px;">+ NEW NOTE</button>

    <div id="inputSection" style="display:none; background:var(--card); padding:15px; border-radius:12px; margin-bottom:20px; border: 1px solid var(--border);">
        <textarea id="noteInput" rows="4" style="width:100%; background:#2a3942; border:none; padding:10px; color:#fff; border-radius:8px; box-sizing:border-box;" placeholder="ඔබේ සටහන..."></textarea>
        <button id="submitBtn" onclick="saveNote()" style="width:100%; margin-top:10px; padding:12px; background:#00a884; border:none; border-radius:8px; color:#fff; font-weight:bold;">SAVE NOTE</button>
    </div>

    <div id="notesFeed"></div>
</div>

<button class="fab" onclick="openChat()">💬</button>

<div id="chatBox">
    <div class="chat-header">
        <button onclick="closeModals()" style="background:none; border:none; color:#fff; font-size:20px;">←</button>
        <img src="https://via.placeholder.com/40" alt="User">
        <div>
            <div style="font-weight:bold;">Yuresh WhatsApp</div>
            <div style="font-size:11px; color:#8696a0;">online</div>
        </div>
    </div>
    
    <div id="chatLogs"></div>

    <div class="chat-input-area">
        <label for="chatFile" class="chat-btn">📎</label>
        <input type="file" id="chatFile" accept="image/*,video/*" style="display:none;" onchange="sendChatMedia()">
        <input type="text" id="chatInput" placeholder="Message">
        <button onclick="sendChatText()" style="background:#00a884; width:45px; height:45px; border-radius:50%; border:none; color:white;">➤</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
    const CLOUDINARY_PRESET = "Yuresh_preset";
    
    let isChatOpen = false;

    // Chat Functions
    async function sendChatMedia() {
        const file = document.getElementById('chatFile').files[0];
        if(!file) return;
        showToast("Uploading media...");
        let fd = new FormData();
        fd.append("file", file);
        fd.append("upload_preset", CLOUDINARY_PRESET);
        
        const res = await fetch(CLOUD_URL, { method: "POST", body: fd });
        const d = await res.json();
        db.ref('community_chat').push({ 
            name: "Yuresh", 
            msg: "", 
            media: d.secure_url, 
            type: file.type.startsWith('video') ? 'video' : 'image',
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        });
    }

    function sendChatText() {
        const i = document.getElementById('chatInput');
        if(!i.value.trim()) return;
        db.ref('community_chat').push({ 
            name: "Yuresh", 
            msg: i.value, 
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
        });
        i.value = "";
    }

    db.ref('community_chat').limitToLast(15).on('value', s => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => {
            const d = c.val();
            const meClass = d.name === "Yuresh" ? "me" : "other";
            let mediaHtml = d.media ? (d.type === 'video' ? `<video src="${d.media}" controls></video>` : `<img src="${d.media}">`) : "";
            l.innerHTML += `<div class="msg ${meClass}">${mediaHtml}${d.msg}<div style="font-size:10px; text-align:right; margin-top:4px; opacity:0.6;">${d.time}</div></div>`;
        });
        l.scrollTop = l.scrollHeight;
    });

    // Notes Logic
    db.ref('smart_notes').on('value', snap => {
        const f = document.getElementById('notesFeed'); f.innerHTML = "";
        snap.forEach(c => {
            const n = c.val(), k = c.key;
            let m = n.url ? (n.fileType === "video" ? `<video src="${n.url}" class="media-content" controls></video>` : `<img src="${n.url}" class="media-content">`) : "";
            f.innerHTML = `<div class="note-card">${m}<div style="font-size:15px; margin-bottom:10px;">${n.text}</div><div class="note-footer"><button class="text-btn" onclick="copyText(\`${n.text}\`)">COPY</button><button class="text-btn" style="color:var(--red)" onclick="deleteNote('${k}')">DELETE</button></div></div>` + f.innerHTML;
        });
    });

    function showToast(m) { const t = document.getElementById('notification'); t.innerText = m; t.style.top = "20px"; setTimeout(() => t.style.top = "-100px", 3000); }
    function copyText(t) { navigator.clipboard.writeText(t); showToast("Copied to clipboard! ✅"); }
    function openChat() { document.getElementById('chatBox').style.display = 'flex'; isChatOpen = true; }
    function closeModals() { document.getElementById('chatBox').style.display = 'none'; isChatOpen = false; }
    function toggleInput() { const s = document.getElementById('inputSection'); s.style.display = s.style.display === "none" ? "block" : "none"; }
    function searchNotes() { const q = document.getElementById('searchInput').value.toLowerCase(); document.querySelectorAll('.note-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none"); }
    function deleteNote(id) { if(confirm("මැකීමට අවශ්‍යද?")) db.ref('smart_notes/' + id).remove(); }
</script>
</body>
</html>
