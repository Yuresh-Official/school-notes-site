<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Smart Notes SL - Glass Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #30d158; --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.15); }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Background Animated Circles */
        .bg-circle { position: fixed; width: 300px; height: 300px; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.4; }
        .c1 { background: #1a73e8; top: -50px; left: -50px; }
        .c2 { background: #30d158; bottom: -50px; right: -50px; }

        .scroll-container { height: 100vh; overflow-y: auto; padding: 20px 15px 120px 15px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; }
        
        /* Glass Card Design */
        .note-card { 
            width: 100%; max-width: 380px; 
            background: var(--glass); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; padding: 15px; margin-bottom: 20px; 
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .user-info { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .p-img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--primary); }
        .u-name { font-size: 14px; font-weight: 600; }

        .media-box { width: 100%; border-radius: 15px; overflow: hidden; margin: 10px 0; background: rgba(0,0,0,0.5); }
        .media-box img, .media-box video { width: 100%; display: block; max-height: 500px; object-fit: contain; }

        /* Floating Toast for Uploads */
        #uploadToast { 
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); 
            background: rgba(25, 25, 27, 0.9); backdrop-filter: blur(10px);
            border: 1px solid var(--primary); padding: 12px 25px; border-radius: 40px; 
            display: none; align-items: center; gap: 12px; z-index: 6000;
        }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 30px; z-index: 1000; box-shadow: 0 10px 20px rgba(48, 209, 88, 0.3); }
        .chat-btn { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; border-radius: 50%; background: #007aff; color: #fff; border: none; font-size: 25px; z-index: 1000; }

        /* Preview Area */
        #previewGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; width: 100%; }
        .prev-box { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 5px; border: 1px solid var(--border); }
        .prev-box img, .prev-box video { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }

        #chatOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 5000; display: none; flex-direction: column; padding: 20px; }
        #chatLogs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
    </style>
</head>
<body>
    <div class="bg-circle c1"></div><div class="bg-circle c2"></div>

    <div id="uploadToast">
        <div style="width:16px; height:16px; border:2px solid var(--primary); border-top-color:transparent; border-radius:50%; animation: spin 1s infinite linear;"></div>
        <span id="toastMsg" style="font-size:14px; font-weight:600;">Processing...</span>
    </div>

    <div class="scroll-container">
        <h2 style="width:100%; max-width:380px; margin-bottom:20px; letter-spacing: 1px;">S-Feed</h2>
        <div id="notesFeed" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <button class="chat-btn" onclick="toggleChat()">💬</button>
    <button class="fab" onclick="toggleAdd()">+</button>

    <div id="addBox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:4500; align-items:center; justify-content:center; padding:20px;">
        <div style="width:100%; max-width:380px;">
            <h3 style="text-align:center;">Share Something</h3>
            <input type="file" id="fileInp" accept="image/*,video/*" multiple onchange="showPrev(this)" style="margin-bottom:15px; font-size:12px; color:gray;">
            <div id="previewGrid"></div>
            <button onclick="startPosting()" id="postBtn" style="width:100%; background:var(--primary); color:#fff; border:none; padding:16px; border-radius:18px; font-weight:700; margin-top:20px;">Post Everything</button>
            <button onclick="toggleAdd()" style="width:100%; background:none; border:none; color:gray; margin-top:10px;">Close</button>
        </div>
    </div>

    <div id="chatOverlay">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>Live Community</h3>
            <button onclick="toggleChat()" style="background:none; border:none; color:#fff; font-size:20px;">×</button>
        </div>
        <div id="chatLogs"></div>
        <div style="display:flex; gap:10px; padding:10px; background:var(--glass); border-radius:20px; border:1px solid var(--border);">
            <input type="text" id="chatInp" placeholder="Type message..." style="flex:1; background:none; border:none; color:#fff; outline:none;">
            <button onclick="sendMsg()" style="color:var(--primary); background:none; border:none; font-weight:700;">Send</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g", databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myData = JSON.parse(localStorage.getItem("smart_user_v2"));
        let isUploading = false;

        window.onbeforeunload = () => isUploading ? "Upload in progress..." : null;

        function showPrev(input) {
            const grid = document.getElementById('previewGrid'); grid.innerHTML = "";
            Array.from(input.files).slice(0, 4).forEach((file, i) => {
                const reader = new FileReader();
                reader.onload = e => {
                    grid.innerHTML += `<div class="prev-box">
                        ${file.type.startsWith('video') ? `<video src="${e.target.result}"></video>` : `<img src="${e.target.result}">`}
                        <input type="text" id="cap-${i}" placeholder="Caption..." style="width:100%; background:#222; border:none; color:#fff; font-size:11px; margin-top:5px; border-radius:5px; padding:5px; box-sizing:border-box;">
                    </div>`;
                };
                reader.readAsDataURL(file);
            });
        }

        function toggleAdd() { const b = document.getElementById('addBox'); b.style.display = b.style.display==='none'?'flex':'none'; }
        function toggleChat() { const b = document.getElementById('chatOverlay'); b.style.display = b.style.display==='none'?'flex':'none'; }

        async function startPosting() {
            const files = document.getElementById('fileInp').files;
            if(files.length === 0) return;

            isUploading = true; toggleAdd();
            const toast = document.getElementById('uploadToast'); toast.style.display = 'flex';

            for(let i=0; i < Math.min(files.length, 4); i++) {
                const file = files[i];
                const caption = document.getElementById(`cap-${i}`).value;
                document.getElementById('toastMsg').innerText = `Uploading ${i+1}/${files.length}`;

                let fd = new FormData();
                let isImg = file.type.startsWith('image');
                let url = isImg ? "https://api.imgbb.com/1/upload?key=87df23f624dc272459c450218569e160" : "https://api.cloudinary.com/v1_1/ds5ig0wvd/upload";
                
                if(isImg) fd.append("image", file);
                else { fd.append("file", file); fd.append("upload_preset", "Yuresh_preset"); }

                try {
                    const res = await fetch(url, { method: "POST", body: fd });
                    const d = await res.json();
                    await db.ref('smart_notes').push({
                        uName: myData.name, uPhoto: myData.photo,
                        text: caption, url: isImg ? d.data.url : d.secure_url,
                        fileType: isImg ? "image" : "video", time: Date.now(), love: 0
                    });
                } catch(e) {}
            }
            isUploading = false; document.getElementById('toastMsg').innerText = "Done!";
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        db.ref('smart_notes').limitToLast(15).on('value', s => {
            const feed = document.getElementById('notesFeed');
            s.forEach(c => {
                const id = c.key, d = c.val();
                if(!document.getElementById('card-'+id)) {
                    let media = d.url ? (d.fileType === "video" ? `<div class="media-box"><video src="${d.url}" controls playsinline preload="none"></video></div>` : `<div class="media-box"><img src="${d.url}" loading="lazy"></div>`) : "";
                    feed.insertAdjacentHTML('afterbegin', `<div class="note-card" id="card-${id}">
                        <div class="user-info"><img src="${d.uPhoto}" class="p-img"><span class="u-name">${d.uName}</span></div>
                        <div style="font-size:14px; margin-bottom:10px;">${d.text || ""}</div>${media}
                        <div style="margin-top:10px;"><button style="background:rgba(255,255,255,0.1); border:none; color:#fff; padding:6px 12px; border-radius:20px; font-size:12px;" onclick="db.ref('smart_notes/${id}/love').transaction(v=>(v||0)+1)">❤️ <span id="l-${id}">${d.love||0}</span></button></div>
                    </div>`);
                } else document.getElementById('l-'+id).innerText = d.love || 0;
            });
        });

        function sendMsg() { const i = document.getElementById('chatInp'); if(i.value){ db.ref('chat').push({n:myData.name, p:myData.photo, m:i.value}); i.value=""; } }
        db.ref('chat').limitToLast(20).on('value', s => {
            const l = document.getElementById('chatLogs'); l.innerHTML = "";
            s.forEach(c => {
                const d = c.val(), isMe = d.n === myData.name;
                l.innerHTML += `<div style="display:flex; flex-direction:${isMe?'row-reverse':'row'}; gap:10px;">
                    <img src="${d.p}" style="width:25px; height:25px; border-radius:50%;">
                    <div style="background:${isMe?var(--primary):'rgba(255,255,255,0.1)'}; padding:10px; border-radius:15px; max-width:70%; font-size:13px;">${d.m}</div>
                </div>`;
            });
            l.scrollTop = l.scrollHeight;
        });
    </script>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
