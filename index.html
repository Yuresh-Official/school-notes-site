<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes Sri Lanka</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <style>
        :root {
            --bg: #000;
            --card: #121212;
            --primary: #4f46e5;
            --text: #fff;
            --border: #333;
            --red: #ff4d4d;
        }
        body[data-theme="light"] { --bg: #f0f2f5; --card: #fff; --text: #000; --border: #ddd; }
        
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; transition: 0.3s; }
        .container { max-width: 500px; margin: auto; padding-bottom: 100px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); margin-bottom: 15px; box-sizing: border-box; }
        
        .main-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        
        .input-card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid var(--border); display: none; }
        .input-card textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); background: #000; color: #fff; box-sizing: border-box; font-size: 15px; resize: vertical; }
        
        .file-label { display: block; background: #1e1e1e; border: 1px dashed var(--border); padding: 15px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 10px; font-size: 14px; color: #aaa; transition: 0.3s; }
        .file-label:hover { border-color: var(--primary); color: #fff; }
        
        .note-card { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; }
        .media-container { width: 100%; margin-bottom: 12px; border-radius: 10px; overflow: hidden; background: #000; }
        .media-content { width: 100%; max-height: 400px; display: block; object-fit: contain; cursor: pointer; }
        
        .note-display { white-space: pre-wrap; word-wrap: break-word; line-height: 1.6; font-size: 15px; margin: 5px 0 15px 0; }
        
        .text-btn { background: #1e1e1e; color: #aaa; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
        .text-btn:hover { background: #222; color: #fff; }
        .note-footer { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 12px; }
        
        .modal-box { position: fixed; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 15px; z-index: 1000; display: none; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-head { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); font-weight: bold; }

        .comment-section { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
        .comment-item { font-size: 13px; margin-bottom: 8px; background: #1a1a1a; padding: 8px; border-radius: 8px; border-left: 3px solid var(--primary); }
        .comment-input-group { display: flex; gap: 8px; margin-top: 12px; }
        .comment-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; }
        .comment-send { background: var(--primary); border: none; color: #fff; padding: 0 15px; border-radius: 8px; cursor: pointer; }

        .fab-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 999; }
        .fab { width: 55px; height: 55px; border-radius: 50%; background: var(--primary); border: none; color: #fff; font-size: 22px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }

        #chatBox { bottom: 90px; height: 450px; flex-direction: column; }
        #chatLogs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 2px; }
        .msg.other { align-self: flex-start; background: #262626; color: #fff; border-bottom-left-radius: 2px; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header">
        <div style="background:orange; padding:6px 14px; border-radius:20px; font-size:12px; font-weight:bold; color:#000;">Smart Notes SL</div>
        <button class="text-btn" style="background:var(--primary); color:#fff;" onclick="cycleThemes()">THEME</button>
    </div>
    
    <h1 style="text-align:center; font-size: 26px; margin: 10px 0;">Digital Diary</h1>

    <input type="text" id="searchInput" class="search-box" placeholder="සටහන් සොයන්න..." onkeyup="searchNotes()">
    
    <button id="mainAddBtn" class="main-btn" onclick="toggleInput()">ADD NEW NOTE</button>

    <div id="inputSection" class="input-card">
        <label class="file-label" for="fileInput">
            <span id="fileIcon">📁</span><br>
            <span id="fileStatus">Photo හෝ Video එකක් තෝරන්න</span>
        </label>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" onchange="updateFileLabel()">
        
        <textarea id="noteInput" rows="4" placeholder="ඔබේ විස්තරය මෙතැන ටයිප් කරන්න..."></textarea>
        
        <input type="hidden" id="editKey">
        <input type="hidden" id="existingUrl">
        <button id="submitBtn" class="main-btn" style="margin-bottom:0;" onclick="saveNote()">SAVE NOTE</button>
    </div>

    <div id="notesFeed"></div>
</div>

<div class="fab-container">
    <button class="fab" onclick="openChat()">💬</button>
    <button class="fab" onclick="openInfo()">ℹ️</button>
</div>

<div id="chatBox" class="modal-box">
    <div class="modal-head"><span>Community Chat</span> <span onclick="closeModals()" style="cursor:pointer">✕</span></div>
    <div id="chatLogs"></div>
    <div style="padding:10px; display:flex; gap:5px; border-top:1px solid #333;">
        <input type="text" id="chatInput" style="flex:1; padding:10px; border-radius:8px; border:1px solid #333; background:#000; color:#fff;" placeholder="පණිවිඩයක් ලියන්න...">
        <button onclick="sendChat()" style="background:var(--primary); border:none; color:#fff; padding:0 15px; border-radius:8px;">➜</button>
    </div>
</div>

<div id="infoModal" class="modal-box" style="height:auto; max-height: 80vh; bottom:90px; overflow-y: auto;">
    <div class="modal-head"><span>Developer Info</span> <span onclick="closeModals()" style="cursor:pointer">✕</span></div>
    <div style="padding:20px; font-size:14px; line-height:1.6;">
        <p><b>Coder:</b> Yuresh kavindu sumanasinha</p>
        <p>මෙම අඩවිය මගින් ඔබට පින්තූර, වීඩියෝ සහ සටහන් එකම තැනක ගබඩා කර ගැනීමට මෙන්ම ඒවා පසුව පහසුවෙන් නැරඹීමටද අවස්ථාව සලසා දෙයි.</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDsJ3-0AXE5e2XYSfBYnXz9Knly1AvOv7g",
        authDomain: "smart-notes-sl.firebaseapp.com",
        databaseURL: "https://smart-notes-sl-default-rtdb.firebaseio.com",
        projectId: "smart-notes-sl",
        storageBucket: "smart-notes-sl.firebasestorage.app",
        messagingSenderId: "887470710465",
        appId: "1:887470710465:web:dced581802fce10ef93e40"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
    let myName = localStorage.getItem('chat_name') || "අමුත්තෙක්";

    const themes = ["dark", "light", "blue", "forest", "rose"];
    let currentThemeIdx = 0;
    function cycleThemes() {
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        document.body.setAttribute('data-theme', themes[currentThemeIdx]);
    }

    function openChat() { document.getElementById('chatBox').style.display = 'flex'; }
    function openInfo() { document.getElementById('infoModal').style.display = 'block'; }
    function closeModals() { document.getElementById('chatBox').style.display = 'none'; document.getElementById('infoModal').style.display = 'none'; }

    function updateFileLabel() {
        const file = document.getElementById('fileInput').files[0];
        if(file) {
            document.getElementById('fileStatus').innerText = file.name;
            document.getElementById('fileIcon').innerText = file.type.includes('video') ? "🎥" : "🖼️";
        }
    }

    function toggleInput() {
        const s = document.getElementById('inputSection'), b = document.getElementById('mainAddBtn');
        s.style.display = (s.style.display === "none" || s.style.display === "") ? "block" : "none";
        b.innerText = (s.style.display === "block") ? "CLOSE" : "ADD NEW NOTE";
        if(s.style.display === "none") resetForm();
    }

    function resetForm() {
        document.getElementById('noteInput').value = "";
        document.getElementById('fileInput').value = "";
        document.getElementById('fileStatus').innerText = "Photo හෝ Video එකක් තෝරන්න";
        document.getElementById('fileIcon').innerText = "📁";
        document.getElementById('editKey').value = "";
        document.getElementById('existingUrl').value = "";
        document.getElementById('submitBtn').innerText = "SAVE NOTE";
        document.getElementById('submitBtn').disabled = false;
    }

    async function saveNote() {
        const text = document.getElementById('noteInput').value;
        const file = document.getElementById('fileInput').files[0];
        const editKey = document.getElementById('editKey').value;
        const existingUrl = document.getElementById('existingUrl').value;
        const submitBtn = document.getElementById('submitBtn');

        if(!text.trim() && !file && !existingUrl) return alert("කරුණාකර විස්තරයක් හෝ ගොනුවක් ඇතුළත් කරන්න.");

        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        let finalUrl = existingUrl || "";
        let finalType = "text";

        try {
            if(file) {
                const storageRef = storage.ref('uploads/' + Date.now() + "_" + file.name);
                const snapshot = await storageRef.put(file);
                finalUrl = await snapshot.ref.getDownloadURL();
                finalType = file.type;
            }

            const noteData = {
                text: text,
                url: finalUrl,
                fileType: finalType,
                time: new Date().toLocaleString(),
                likes: 0,
                hearts: 0
            };

            if(editKey) {
                delete noteData.likes; delete noteData.hearts; delete noteData.time;
                await db.ref('smart_notes/' + editKey).update(noteData);
            } else {
                await db.ref('smart_notes').push(noteData);
            }
            toggleInput();
        } catch (error) {
            alert("අසාර්ථකයි: " + error.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "SAVE NOTE";
        }
    }

    function renderMedia(url, type) {
        if(!url) return "";
        const isVideo = type && type.includes('video') || url.includes('.mp4') || url.includes('video');
        
        if (isVideo) {
            return `<div class="media-container"><video src="${url}" class="media-content" controls></video></div>`;
        } else {
            // Clicking the image opens it in full size
            return `<div class="media-container"><img src="${url}" class="media-content" onclick="window.open('${url}', '_blank')"></div>`;
        }
    }

    function sendChat() {
        const i = document.getElementById('chatInput');
        if(i.value.trim()) { db.ref('community_chat').push({ name: myName, msg: i.value, time: Date.now() }); i.value = ""; }
    }

    db.ref('community_chat').limitToLast(30).on('value', (s) => {
        const l = document.getElementById('chatLogs'); l.innerHTML = "";
        s.forEach(c => {
            const d = c.val(); l.innerHTML += `<div class="msg ${d.name === myName ? 'me' : 'other'}"><b>${d.name}</b><br>${d.msg}</div>`;
        });
        l.scrollTop = l.scrollHeight;
    });

    function toggleComments(id) {
        const sec = document.getElementById(`com-sec-${id}`);
        sec.style.display = (sec.style.display === "none" || sec.style.display === "") ? "block" : "none";
    }

    function addComment(noteId) {
        const input = document.getElementById(`comment-in-${noteId}`);
        if(input.value.trim()) {
            db.ref(`smart_notes/${noteId}/comments`).push({ name: myName, text: input.value, time: Date.now() });
            input.value = "";
        }
    }

    function editNote(key, text, url) {
        toggleInput();
        document.getElementById('noteInput').value = text;
        document.getElementById('existingUrl').value = url;
        document.getElementById('editKey').value = key;
        document.getElementById('submitBtn').innerText = "UPDATE NOW";
        document.getElementById('fileStatus').innerText = "පැරණි ගොනුවක් ඇත (වෙනස් කිරීමට තෝරන්න)";
        window.scrollTo(0,0);
    }

    function deleteNote(id) { if(confirm("මෙම සටහන මැකීමට ඔබට විශ්වාසද?")) db.ref('smart_notes/' + id).remove(); }
    function react(k, ty) { db.ref(`smart_notes/${k}/${ty}`).transaction(c => (c || 0) + 1); }

    function searchNotes() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.note-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none");
    }

    db.ref('smart_notes').on('value', (snap) => {
        const f = document.getElementById('notesFeed'); f.innerHTML = "";
        snap.forEach((c) => {
            const n = c.val(), k = c.key;
            let mediaHtml = renderMedia(n.url, n.fileType);
            let commentsHtml = "";
            if(n.comments) { Object.values(n.comments).forEach(com => { commentsHtml += `<div class="comment-item"><b>${com.name}:</b> ${com.text}</div>`; }); }

            const div = document.createElement('div'); div.className = 'note-card';
            div.innerHTML = `
                ${mediaHtml}
                <div class="note-display">${n.text}</div>
                <div style="display:flex; gap:10px;">
                    <button class="text-btn" onclick="react('${k}','likes')">👍 ${n.likes||0}</button>
                    <button class="text-btn" onclick="react('${k}','hearts')">❤️ ${n.hearts||0}</button>
                    <button class="text-btn" onclick="toggleComments('${k}')">💬 Comments</button>
                </div>
                <div class="comment-section" id="com-sec-${k}">
                    <div class="comment-list">${commentsHtml}</div>
                    <div class="comment-input-group">
                        <input type="text" id="comment-in-${k}" class="comment-input" placeholder="අදහසක් දක්වන්න...">
                        <button class="comment-send" onclick="addComment('${k}')">➜</button>
                    </div>
                </div>
                <div class="note-footer">
                    <div style="display:flex; gap:5px;">
                        <button class="text-btn" onclick="navigator.clipboard.writeText(\`${n.text.replace(/`/g, '\\`').replace(/\n/g, '\\n')}\`)">COPY</button>
                        <button class="text-btn" onclick="editNote('${k}', \`${n.text.replace(/`/g, '\\`').replace(/\n/g, '\\n')}\`, '${n.url}')">EDIT</button>
                    </div>
                    <button class="text-btn" style="color:var(--red)" onclick="deleteNote('${k}')">DELETE</button>
                </div>`;
            f.prepend(div);
        });
    });
</script>
</body>
</html>
